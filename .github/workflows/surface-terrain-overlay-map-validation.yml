name: Surface Terrain Overlay Map Validation

on:
  pull_request:
    paths:
      - "systems/SurfaceTerrainOverlayMap.gd"
      - "tests/surface_terrain_overlay_map_test.gd"
      - "tests/surface_terrain_overlay_map_benchmark.gd"
      - "docs/SURFACE_TERRAIN_OVERLAY_MAP_PROTOTYPE_M0_3_19.md"
      - ".github/workflows/surface-terrain-overlay-map-validation.yml"

concurrency:
  group: surface-terrain-overlay-map-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  overlay-map-validation:
    name: Godot 4.3 persistent overlay-map contract and benchmark
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container:
      image: barichello/godot-ci:4.3
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Verify inputs
        shell: bash
        run: |
          set -euo pipefail
          godot --version
          test -f project.godot
          test -f systems/SurfaceTerrainOverlayMap.gd
          test -f tests/surface_terrain_overlay_map_test.gd
          test -f tests/surface_terrain_overlay_map_benchmark.gd
          grep -Fq 'MAX_OVERLAY_DEPTH: int = 8' systems/SurfaceTerrainOverlayMap.gd
          grep -Fq 'func fork()' systems/SurfaceTerrainOverlayMap.gd
          grep -Fq 'func materialize()' systems/SurfaceTerrainOverlayMap.gd
      - name: Import and parse root project
        run: godot --headless --path . --editor --quit
      - name: Run persistent overlay-map contract regression
        shell: bash
        run: |
          set -o pipefail
          output="$(timeout -k 5s 120s godot --headless --path . --script res://tests/surface_terrain_overlay_map_test.gd 2>&1)" || { echo "$output"; exit 1; }
          echo "$output"
          if echo "$output" | grep -E 'SCRIPT ERROR|ERROR:|FAIL:'; then exit 1; fi
          echo "$output" | grep -q "Surface terrain overlay map tests passed."
      - name: Run matched Dictionary-vs-overlay benchmark
        shell: bash
        run: |
          set -euo pipefail
          set -o pipefail
          timeout -k 5s 180s godot --headless --path . --script res://tests/surface_terrain_overlay_map_benchmark.gd 2>&1 | tee surface_terrain_overlay_map_benchmark.log
          grep -q "Surface terrain overlay map benchmark completed." surface_terrain_overlay_map_benchmark.log
          test "$(grep -c '^SURFACE_TERRAIN_OVERLAY_MAP_BENCHMARK_JSON:' surface_terrain_overlay_map_benchmark.log)" -eq 4
          grep '^SURFACE_TERRAIN_OVERLAY_MAP_BENCHMARK_JSON:' surface_terrain_overlay_map_benchmark.log | sed 's/^SURFACE_TERRAIN_OVERLAY_MAP_BENCHMARK_JSON://' > surface_terrain_overlay_map_benchmark.jsonl
      - name: Upload reproducible overlay-map benchmark
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surface-terrain-overlay-map-benchmark
          path: |
            surface_terrain_overlay_map_benchmark.log
            surface_terrain_overlay_map_benchmark.jsonl
          if-no-files-found: warn
          retention-days: 30
      - name: Verify clean workspace
        if: always()
        shell: bash
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git clean -fd
          test -z "$(git status --porcelain)"
