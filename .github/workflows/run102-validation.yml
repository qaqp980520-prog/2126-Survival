name: Run 102 focused Godot validation

on:
  pull_request:
    paths:
      - 'daily_games/KROLL_Reactor_Deck_Command/**'
      - 'systems/MineralGridStreamingDirector.gd'
      - 'tests/mineral_grid_streaming_duplicate_staged_root_test.gd'
      - 'tests/README_run102_streaming_duplicate_root.md'
      - 'prototypes/SurvivalTestHub.gd'
      - 'tests/survival_test_hub_smoke_test.gd'
      - '.github/workflows/run102-validation.yml'
  workflow_dispatch:

jobs:
  validate:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify Run 102 inputs
        shell: bash
        run: |
          set -euo pipefail
          godot --version
          test -f daily_games/KROLL_Reactor_Deck_Command/project.godot
          test -f daily_games/KROLL_Reactor_Deck_Command/main.tscn
          test -f daily_games/KROLL_Reactor_Deck_Command/main_root.tscn
          test -f daily_games/KROLL_Reactor_Deck_Command/main.gd
          test -f daily_games/KROLL_Reactor_Deck_Command/rules.gd
          test -f daily_games/KROLL_Reactor_Deck_Command/tests/rules_test.gd
          test -f daily_games/KROLL_Reactor_Deck_Command/tests/game_smoke_test.gd
          test -f tests/mineral_grid_streaming_duplicate_staged_root_test.gd
          grep -q 'REACTOR_DECK_COMMAND_SCENE' prototypes/SurvivalTestHub.gd
          grep -q 'labels.has("KROLL Reactor Deck Command")' tests/survival_test_hub_smoke_test.gd
          grep -q 'buttons.size() == 50' tests/survival_test_hub_smoke_test.gd
          grep -q 'staged_candidate == candidate' systems/MineralGridStreamingDirector.gd
          grep -q 'duplicate_staged_root_rejected' systems/MineralGridStreamingDirector.gd
          grep -q '^func _expect(condition: bool, description: String)' tests/mineral_grid_streaming_duplicate_staged_root_test.gd

      - name: Import and parse KROLL Reactor Deck Command
        run: godot --headless --path daily_games/KROLL_Reactor_Deck_Command --editor --quit

      - name: Run KROLL Reactor Deck Command rules tests
        shell: bash
        run: |
          set -o pipefail
          output="$(timeout -k 5s 45s godot --headless --path daily_games/KROLL_Reactor_Deck_Command --script res://tests/rules_test.gd 2>&1)" || { echo "$output"; exit 1; }
          echo "$output"
          if echo "$output" | grep -E 'SCRIPT ERROR|ERROR:|FAIL:'; then exit 1; fi
          echo "$output" | grep -q "KROLL Reactor Deck Command rules tests passed."

      - name: Run KROLL Reactor Deck Command runtime smoke test
        shell: bash
        run: |
          set -o pipefail
          output="$(timeout -k 5s 50s godot --headless --path daily_games/KROLL_Reactor_Deck_Command --script res://tests/game_smoke_test.gd 2>&1)" || { echo "$output"; exit 1; }
          echo "$output"
          if echo "$output" | grep -E 'SCRIPT ERROR|ERROR:|FAIL:'; then exit 1; fi
          echo "$output" | grep -q "KROLL Reactor Deck Command runtime smoke test passed."

      - name: Import and parse root Survival project
        run: godot --headless --path . --editor --quit

      - name: Run root Test Hub smoke test
        shell: bash
        run: |
          set -o pipefail
          output="$(timeout -k 5s 90s godot --headless --path . --script res://tests/survival_test_hub_smoke_test.gd 2>&1)" || { echo "$output"; exit 1; }
          echo "$output"
          if echo "$output" | grep -E 'SCRIPT ERROR|ERROR:|FAIL:'; then exit 1; fi
          echo "$output" | grep -q "Survival test hub smoke test passed."

      - name: Run async duplicate staged-root regression
        shell: bash
        run: |
          set -o pipefail
          output="$(timeout -k 5s 90s godot --headless --path . --script res://tests/mineral_grid_streaming_duplicate_staged_root_test.gd 2>&1)" || { echo "$output"; exit 1; }
          echo "$output"
          if echo "$output" | grep -E 'SCRIPT ERROR|ERROR:|FAIL:'; then exit 1; fi
          echo "$output" | grep -q "Mineral grid duplicate staged-root regression passed."
