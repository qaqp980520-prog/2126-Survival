name: Run 111 focused validation

on:
  pull_request:
    paths:
      - "daily_games/KROLL_Tidal_Lock_Operator/**"
      - "systems/SurvivalWorldBridge.gd"
      - "tests/helpers/LegacyInventoryCountFixture.gd"
      - "tests/helpers/MethodInventoryCountFixture.gd"
      - "tests/world_bridge_legacy_inventory_count_test.gd"
      - "tests/README_run111_inventory_bridge_count_validation.md"
      - ".github/workflows/run111-validation.yml"
      - ".github/workflows/godot-validation.yml"
  push:
    branches: [main]
    paths:
      - "daily_games/KROLL_Tidal_Lock_Operator/**"
      - "systems/SurvivalWorldBridge.gd"
      - "tests/helpers/LegacyInventoryCountFixture.gd"
      - "tests/helpers/MethodInventoryCountFixture.gd"
      - "tests/world_bridge_legacy_inventory_count_test.gd"
      - "tests/README_run111_inventory_bridge_count_validation.md"
      - ".github/workflows/run111-validation.yml"
      - ".github/workflows/godot-validation.yml"

jobs:
  validate:
    name: Run 111 Focused Gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container:
      image: barichello/godot-ci:4.3
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Verify Run 111 inputs
        shell: bash
        run: |
          set -euo pipefail
          godot --version
          test -f daily_games/KROLL_Tidal_Lock_Operator/project.godot
          test -f daily_games/KROLL_Tidal_Lock_Operator/main.tscn
          test -f daily_games/KROLL_Tidal_Lock_Operator/main.gd
          test -f daily_games/KROLL_Tidal_Lock_Operator/rules.gd
          test -f daily_games/KROLL_Tidal_Lock_Operator/tests/rules_test.gd
          test -f daily_games/KROLL_Tidal_Lock_Operator/tests/game_smoke_test.gd
          test -f tests/world_bridge_legacy_inventory_count_test.gd
          grep -Fq 'func _validated_bridge_count' systems/SurvivalWorldBridge.gd
      - name: Import and parse KROLL Tidal Lock Operator
        run: godot --headless --path daily_games/KROLL_Tidal_Lock_Operator --editor --quit
      - name: Run KROLL Tidal Lock Operator rules tests
        shell: bash
        run: |
          set -o pipefail
          output="$(timeout -k 5s 45s godot --headless --path daily_games/KROLL_Tidal_Lock_Operator --script res://tests/rules_test.gd 2>&1)" || { echo "$output"; exit 1; }
          echo "$output"
          if echo "$output" | grep -E 'SCRIPT ERROR|ERROR:|FAIL:'; then exit 1; fi
          echo "$output" | grep -q "KROLL Tidal Lock Operator rules tests passed."
      - name: Run KROLL Tidal Lock Operator runtime smoke test
        shell: bash
        run: |
          set -o pipefail
          output="$(timeout -k 5s 50s godot --headless --path daily_games/KROLL_Tidal_Lock_Operator --script res://tests/game_smoke_test.gd 2>&1)" || { echo "$output"; exit 1; }
          echo "$output"
          if echo "$output" | grep -E 'SCRIPT ERROR|ERROR:|FAIL:'; then exit 1; fi
          echo "$output" | grep -q "KROLL Tidal Lock Operator runtime smoke test passed."
      - name: Import and parse root project
        run: godot --headless --path . --editor --quit
      - name: Run world bridge custom inventory count validation
        shell: bash
        run: |
          set -o pipefail
          output="$(timeout -k 5s 60s godot --headless --path . --script res://tests/world_bridge_legacy_inventory_count_test.gd 2>&1)" || { echo "$output"; exit 1; }
          echo "$output"
          if echo "$output" | grep -E 'SCRIPT ERROR|ERROR:|FAIL:'; then exit 1; fi
          echo "$output" | grep -q "World bridge custom inventory count validation tests passed."
      - name: Checkout cleanup
        if: always()
        shell: bash
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git status --short
