name: Godot headless validation

on:
  push:
    branches:
      - main
      - 'ci/godot-headless-validation-2026-10-25'
  pull_request:
    paths:
      - 'systems/**'
      - 'scripts/**'
      - 'world/**'
      - 'tests/**'
      - 'daily_games/**'
      - 'prototypes/**'
      - 'project.godot'
      - 'PROJECT_INDEX.md'
      - 'docs/**'
      - '.github/workflows/godot-validation.yml'
  workflow_dispatch:

concurrency:
  group: godot-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Prepare candidate files when not yet merged
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          if [ ! -f daily_games/KROLL_Signal_Sweep/project.godot ]; then
            git fetch origin feature/daily-kroll-signal-sweep-2026-10-25
            git checkout FETCH_HEAD -- daily_games/KROLL_Signal_Sweep
          fi
          if [ ! -f systems/SurvivalInventory.gd ] || [ ! -f tests/inventory_save_validation.gd ]; then
            git fetch origin fix/inventory-save-validation-2026-10-25
            git checkout FETCH_HEAD -- systems/SurvivalInventory.gd tests/inventory_save_validation.gd
          fi
          if [ ! -f systems/SurvivalInventorySaveAdapter.gd ] || [ ! -f tests/inventory_save_adapter.gd ]; then
            git fetch origin feature/m1-3-inventory-save-adapter-2026-10-25
            git checkout FETCH_HEAD -- systems/SurvivalInventorySaveAdapter.gd tests/inventory_save_adapter.gd
          fi
          if [ ! -f daily_games/KROLL_Orbital_Convoy/project.godot ] || [ ! -f systems/BackroomsPortalDirector.gd ] || [ ! -f tests/backrooms_portal_director_test.gd ]; then
            git fetch origin feature/kroll-orbital-convoy-backrooms-portals-2026-10-26
            git checkout FETCH_HEAD -- daily_games/KROLL_Orbital_Convoy systems/BackroomsPortalDirector.gd tests/backrooms_portal_director_test.gd tests/backrooms_portal_scene_test.gd systems/BackroomsPortalVisual.gd systems/BackroomsPortalVisual.tscn docs/BACKROOMS_RANDOM_PORTAL_DIRECTOR_M0_1.md
          fi
      - name: Print engine version and verify test inputs
        run: |
          godot --version
          test -f daily_games/KROLL_Signal_Sweep/project.godot
          test -f daily_games/KROLL_Orbital_Convoy/project.godot
          test -f daily_games/KROLL_Gravity_Lander/project.godot
          test -f daily_games/KROLL_Core_Defense/project.godot
          test -f daily_games/KROLL_Freight_Sorter/project.godot
          test -f daily_games/KROLL_Freight_Sorter/tests/rules_test.gd
          test -f daily_games/KROLL_Freight_Sorter/tests/game_smoke_test.gd
          test -f daily_games/KROLL_Pulse_Rhythm/project.godot
          test -f daily_games/KROLL_Pulse_Rhythm/tests/rules_test.gd
          test -f daily_games/KROLL_Pulse_Rhythm/tests/game_smoke_test.gd
          test -f daily_games/KROLL_Hydroponics_Shift/project.godot
          test -f daily_games/KROLL_Hydroponics_Shift/tests/rules_test.gd
          test -f daily_games/KROLL_Hydroponics_Shift/tests/game_smoke_test.gd
          test -f systems/MineralChunkController.gd
