name: Godot headless validation

on:
  push:
    branches:
      - 'ci/godot-headless-validation-2026-10-25'
  pull_request:
    paths:
      - 'systems/**'
      - 'tests/**'
      - 'daily_games/**'
      - 'prototypes/**'
      - 'project.godot'
      - 'PROJECT_INDEX.md'
      - 'docs/**'
      - '.github/workflows/godot-validation.yml'
  workflow_dispatch:

concurrency:
  group: godot-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Prepare candidate files when not yet merged
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          if [ ! -f daily_games/KROLL_Signal_Sweep/project.godot ]; then
            git fetch origin feature/daily-kroll-signal-sweep-2026-10-25
            git checkout FETCH_HEAD -- daily_games/KROLL_Signal_Sweep
          fi
          if [ ! -f systems/SurvivalInventory.gd ] || [ ! -f tests/inventory_save_validation.gd ]; then
            git fetch origin fix/inventory-save-validation-2026-10-25
            git checkout FETCH_HEAD -- systems/SurvivalInventory.gd tests/inventory_save_validation.gd
          fi
          if [ ! -f systems/SurvivalInventorySaveAdapter.gd ] || [ ! -f tests/inventory_save_adapter.gd ]; then
            git fetch origin feature/m1-3-inventory-save-adapter-2026-10-25
            git checkout FETCH_HEAD -- systems/SurvivalInventorySaveAdapter.gd tests/inventory_save_adapter.gd
          fi
          if [ ! -f daily_games/KROLL_Orbital_Convoy/project.godot ] || [ ! -f systems/BackroomsPortalDirector.gd ] || [ ! -f tests/backrooms_portal_director_test.gd ]; then
            git fetch origin feature/kroll-orbital-convoy-backrooms-portals-2026-10-26
            git checkout FETCH_HEAD -- daily_games/KROLL_Orbital_Convoy systems/BackroomsPortalDirector.gd tests/backrooms_portal_director_test.gd tests/backrooms_portal_scene_test.gd systems/BackroomsPortalVisual.gd systems/BackroomsPortalVisual.tscn docs/BACKROOMS_RANDOM_PORTAL_DIRECTOR_M0_1.md
          fi
      - name: Print engine version and verify test inputs
        run: |
          godot --version
          test -f daily_games/KROLL_Signal_Sweep/project.godot
          test -f daily_games/KROLL_Orbital_Convoy/project.godot
          test -f daily_games/KROLL_Gravity_Lander/project.godot
          test -f tests/inventory_save_validation.gd
          test -f tests/inventory_save_adapter.gd
          test -f tests/backrooms_portal_director_test.gd
          test -f tests/backrooms_portal_scene_test.gd
          test -f tests/backrooms_portal_playground_test.gd
          test -f tests/world_bridge_save_adapter_integration.gd
      - name: Import and parse KROLL Signal Sweep
        run: godot --headless --path daily_games/KROLL_Signal_Sweep --editor --quit
      - name: Run KROLL Signal Sweep rules tests
        run: godot --headless --path daily_games/KROLL_Signal_Sweep --script res://tests/rules_test.gd
      - name: Run KROLL Signal Sweep runtime smoke test
        run: godot --headless --path daily_games/KROLL_Signal_Sweep --script res://tests/game_smoke_test.gd
      - name: Import and parse KROLL Orbital Convoy
        run: godot --headless --path daily_games/KROLL_Orbital_Convoy --editor --quit
      - name: Run KROLL Orbital Convoy rules tests
        run: godot --headless --path daily_games/KROLL_Orbital_Convoy --script res://tests/rules_test.gd
      - name: Run KROLL Orbital Convoy runtime smoke test
        run: godot --headless --path daily_games/KROLL_Orbital_Convoy --script res://tests/game_smoke_test.gd
      - name: Import and parse KROLL Gravity Lander
        run: godot --headless --path daily_games/KROLL_Gravity_Lander --editor --quit
      - name: Run KROLL Gravity Lander rules tests
        run: godot --headless --path daily_games/KROLL_Gravity_Lander --script res://tests/rules_test.gd
      - name: Run KROLL Gravity Lander runtime smoke test
        run: godot --headless --path daily_games/KROLL_Gravity_Lander --script res://tests/game_smoke_test.gd
      - name: Run Backrooms portal director tests
        run: godot --headless --path . --script res://tests/backrooms_portal_director_test.gd
      - name: Run Backrooms portal visual scene smoke test
        run: godot --headless --path . --script res://tests/backrooms_portal_scene_test.gd
      - name: Run Backrooms portal playground integration test
        run: godot --headless --path . --script res://tests/backrooms_portal_playground_test.gd
      - name: Run inventory save validation tests
        run: godot --headless --path . --script res://tests/inventory_save_validation.gd
      - name: Run inventory save adapter tests
        run: godot --headless --path . --script res://tests/inventory_save_adapter.gd
      - name: Run world bridge save adapter integration test
        run: godot --headless --path . --script res://tests/world_bridge_save_adapter_integration.gd
