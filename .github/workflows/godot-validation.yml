      - name: Import and parse root 2126 Survival project
        shell: bash
        run: |
          set -o pipefail
          output="$(godot --headless --path . --editor --quit 2>&1)" || { echo "$output"; exit 1; }
          echo "$output"
          if echo "$output" | grep -E 'SCRIPT ERROR|ERROR:'; then
            echo "Godot reported root-project import or parse errors."
