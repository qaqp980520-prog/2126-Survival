name: Run 117 focused validation

on:
  pull_request:
    paths:
      - "daily_games/KROLL_Thermal_Containment_Lab/**"
      - "systems/SurvivalWorldBridge.gd"
      - "tests/world_bridge_restore_success_verification_test.gd"
      - "docs/README_run117_restore_success_verification.md"
      - ".github/workflows/run117-validation.yml"
      - ".github/workflows/godot-validation.yml"
  push:
    branches: [main]
    paths:
      - "daily_games/KROLL_Thermal_Containment_Lab/**"
      - "systems/SurvivalWorldBridge.gd"
      - "tests/world_bridge_restore_success_verification_test.gd"
      - "docs/README_run117_restore_success_verification.md"
      - ".github/workflows/run117-validation.yml"
      - ".github/workflows/godot-validation.yml"

jobs:
  validate:
    name: Run 117 Focused Gate
    runs-on: ubuntu-latest
    timeout-minutes: 12
    container:
      image: barichello/godot-ci:4.3
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Verify Run 117 inputs
        shell: bash
        run: |
          set -euo pipefail
          godot --version
          test -f daily_games/KROLL_Thermal_Containment_Lab/project.godot
          test -f daily_games/KROLL_Thermal_Containment_Lab/main.tscn
          test -f daily_games/KROLL_Thermal_Containment_Lab/main.gd
          test -f daily_games/KROLL_Thermal_Containment_Lab/rules.gd
          test -f daily_games/KROLL_Thermal_Containment_Lab/tests/rules_test.gd
          test -f daily_games/KROLL_Thermal_Containment_Lab/tests/game_smoke_test.gd
          test -f systems/SurvivalWorldBridge.gd
          test -f tests/world_bridge_restore_success_verification_test.gd
          grep -Fq 'func _is_valid_restore_payload' systems/SurvivalWorldBridge.gd
      - name: Import and parse KROLL Thermal Containment Lab
        run: godot --headless --path daily_games/KROLL_Thermal_Containment_Lab --editor --quit
      - name: Run KROLL Thermal Containment rules tests
        shell: bash
        run: |
          set -o pipefail
          output="$(timeout -k 5s 60s godot --headless --path daily_games/KROLL_Thermal_Containment_Lab --script res://tests/rules_test.gd 2>&1)" || { echo "$output"; exit 1; }
          echo "$output"
          if echo "$output" | grep -E 'SCRIPT ERROR|ERROR:|FAIL:'; then exit 1; fi
          echo "$output" | grep -q "KROLL Thermal Containment rules tests passed."
      - name: Run KROLL Thermal Containment runtime smoke test
        shell: bash
        run: |
          set -o pipefail
          output="$(timeout -k 5s 60s godot --headless --path daily_games/KROLL_Thermal_Containment_Lab --script res://tests/game_smoke_test.gd 2>&1)" || { echo "$output"; exit 1; }
          echo "$output"
          if echo "$output" | grep -E 'SCRIPT ERROR|ERROR:|FAIL:'; then exit 1; fi
          echo "$output" | grep -q "KROLL Thermal Containment runtime smoke test passed."
      - name: Import and parse root project
        run: godot --headless --path . --editor --quit
      - name: Run world bridge restore success verification regression
        shell: bash
        run: |
          set -o pipefail
          output="$(timeout -k 5s 90s godot --headless --path . --script res://tests/world_bridge_restore_success_verification_test.gd 2>&1)" || { echo "$output"; exit 1; }
          echo "$output"
          if echo "$output" | grep -E 'SCRIPT ERROR|ERROR:|FAIL:'; then exit 1; fi
          echo "$output" | grep -q "World bridge restore success verification tests passed."
      - name: Checkout cleanup
        if: always()
        shell: bash
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git clean -fd
          git status --short
          test -z "$(git status --porcelain)"
      - name: Post Checkout repository
        if: always()
        run: git status --short
      - name: Stop containers
        if: always()
        run: true
      - name: Complete job
        if: always()
        run: echo "Run 117 focused validation job complete."
