name: Surface Terrain Collider Rollback Fault Injection Validation

on:
  pull_request:
    paths:
      - 'systems/SurfaceTerrainTransitionColliderManager.gd'
      - 'systems/SurfaceTerrainPatch.gd'
      - 'systems/SurfaceTerrainAdjacencyBinder.gd'
      - 'systems/SurfaceTerrainCornerConflictResolver.gd'
      - 'tests/fixtures/fault_injecting_surface_terrain_transition_collider_manager.gd'
      - 'tests/fixtures/fault_injecting_surface_terrain_patch.gd'
      - 'tests/surface_terrain_transition_collider_rollback_test.gd'
      - '.github/workflows/surface-terrain-transition-collider-rollback-validation.yml'
  workflow_dispatch:

concurrency:
  group: surface-terrain-collider-rollback-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  collider-rollback:
    name: Godot 4.3 real collider-manager rollback regression
    runs-on: ubuntu-latest
    timeout-minutes: 7
    container:
      image: barichello/godot-ci:4.3
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Verify exact test inputs
        shell: bash
        run: |
          set -euo pipefail
          godot --version
          test -f project.godot
          test -f systems/SurfaceTerrainTransitionColliderManager.gd
          test -f systems/SurfaceTerrainPatch.gd
          test -f systems/SurfaceTerrainAdjacencyBinder.gd
          test -f systems/SurfaceTerrainCornerConflictResolver.gd
          test -f tests/fixtures/fault_injecting_surface_terrain_transition_collider_manager.gd
          test -f tests/fixtures/fault_injecting_surface_terrain_patch.gd
          test -f tests/surface_terrain_transition_collider_rollback_test.gd
      - name: Import and parse root project
        run: godot --headless --path . --editor --quit
      - name: Run real collider-manager rollback fault-injection tests
        shell: bash
        run: |
          set -o pipefail
          output="$(timeout -k 5s 90s godot --headless --path . --script res://tests/surface_terrain_transition_collider_rollback_test.gd 2>&1)" || { echo "$output"; exit 1; }
          echo "$output"
          if echo "$output" | grep -E 'SCRIPT ERROR|ERROR:|FAIL:'; then exit 1; fi
          echo "$output" | grep -q "Surface terrain collider rollback fault-injection tests passed."
      - name: Verify clean workspace
        if: always()
        shell: bash
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git clean -fd
          test -z "$(git status --porcelain)"
