name: Run 92 focused Godot validation

on:
  pull_request:
    paths:
      - 'daily_games/KROLL_Swarm_Dispatcher/**'
      - 'tests/survival_test_hub_smoke_test.gd'
      - 'tests/mineral_grid_streaming_async_test.gd'
      - 'prototypes/SurvivalTestHub.gd'
      - '.github/workflows/run92-validation.yml'
  workflow_dispatch:

jobs:
  validate:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Print engine version and verify Run 92 inputs
        run: |
          set -euo pipefail
          godot --version
          test -f daily_games/KROLL_Swarm_Dispatcher/project.godot
          test -f daily_games/KROLL_Swarm_Dispatcher/main.tscn
          test -f daily_games/KROLL_Swarm_Dispatcher/main_root.tscn
          test -f daily_games/KROLL_Swarm_Dispatcher/main.gd
          test -f daily_games/KROLL_Swarm_Dispatcher/rules.gd
          test -f daily_games/KROLL_Swarm_Dispatcher/tests/rules_test.gd
          test -f daily_games/KROLL_Swarm_Dispatcher/tests/game_smoke_test.gd
          grep -q 'range(128)' tests/mineral_grid_streaming_async_test.gd
          grep -q 'rng.seed = 0x91A55EED' tests/mineral_grid_streaming_async_test.gd
          grep -q 'SWARM_DISPATCHER_SCENE' prototypes/SurvivalTestHub.gd
          grep -q 'KROLL Swarm Dispatcher' tests/survival_test_hub_smoke_test.gd

      - name: Import and parse KROLL Swarm Dispatcher
        run: godot --headless --path daily_games/KROLL_Swarm_Dispatcher --editor --quit

      - name: Run KROLL Swarm Dispatcher rules tests
        shell: bash
        run: |
          set -o pipefail
          output="$(timeout -k 5s 35s godot --headless --path daily_games/KROLL_Swarm_Dispatcher --script res://tests/rules_test.gd 2>&1)" || { echo "$output"; exit 1; }
          echo "$output"
          if echo "$output" | grep -E 'SCRIPT ERROR|ERROR:|FAIL:'; then exit 1; fi
          echo "$output" | grep -q "KROLL Swarm Dispatcher rules tests passed."

      - name: Run KROLL Swarm Dispatcher runtime smoke test
        shell: bash
        run: |
          set -o pipefail
          output="$(timeout -k 5s 40s godot --headless --path daily_games/KROLL_Swarm_Dispatcher --script res://tests/game_smoke_test.gd 2>&1)" || { echo "$output"; exit 1; }
          echo "$output"
          if echo "$output" | grep -E 'SCRIPT ERROR|ERROR:|FAIL:'; then exit 1; fi
          echo "$output" | grep -q "KROLL Swarm Dispatcher runtime smoke test passed."

      - name: Import and parse root 2126 Survival project
        run: godot --headless --path . --editor --quit

      - name: Run root Test Hub integration smoke test
        shell: bash
        run: |
          set -o pipefail
          output="$(timeout -k 5s 60s godot --headless --path . --script res://tests/survival_test_hub_smoke_test.gd 2>&1)" || { echo "$output"; exit 1; }
          echo "$output"
          if echo "$output" | grep -E 'SCRIPT ERROR|ERROR:|FAIL:'; then exit 1; fi
          echo "$output" | grep -q "Survival test hub smoke test passed."

      - name: Run 128-shift randomized async streaming regression
        shell: bash
        run: |
          set -o pipefail
          output="$(timeout -k 5s 150s godot --headless --path . --script res://tests/mineral_grid_streaming_async_test.gd 2>&1)" || { echo "$output"; exit 1; }
          echo "$output"
          if echo "$output" | grep -E 'SCRIPT ERROR|ERROR:|FAIL:'; then exit 1; fi
          echo "$output" | grep -q "Mineral grid bounded async streaming tests passed."
