name: Run 118 focused validation

on:
  pull_request:
    paths:
      - "daily_games/KROLL_Moonbase_Courier/**"
      - "systems/SurvivalWorldBridge.gd"
      - "tests/world_bridge_restore_reentrancy_test.gd"
      - "docs/README_run118_moonbase_courier.md"
      - "docs/README_run118_restore_reentrancy_guard.md"
      - ".github/workflows/run118-validation.yml"
      - ".github/workflows/godot-validation.yml"
  push:
    branches: [main]
    paths:
      - "daily_games/KROLL_Moonbase_Courier/**"
      - "systems/SurvivalWorldBridge.gd"
      - "tests/world_bridge_restore_reentrancy_test.gd"
      - "docs/README_run118_moonbase_courier.md"
      - "docs/README_run118_restore_reentrancy_guard.md"
      - ".github/workflows/run118-validation.yml"
      - ".github/workflows/godot-validation.yml"

jobs:
  validate:
    name: Run 118 Focused Gate
    runs-on: ubuntu-latest
    timeout-minutes: 12
    container:
      image: barichello/godot-ci:4.3
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Verify Run 118 inputs
        shell: bash
        run: |
          set -euo pipefail
          godot --version
          test -f daily_games/KROLL_Moonbase_Courier/project.godot
          test -f daily_games/KROLL_Moonbase_Courier/main.tscn
          test -f daily_games/KROLL_Moonbase_Courier/main.gd
          test -f daily_games/KROLL_Moonbase_Courier/rules.gd
          test -f daily_games/KROLL_Moonbase_Courier/tests/rules_test.gd
          test -f daily_games/KROLL_Moonbase_Courier/tests/game_smoke_test.gd
          test -f systems/SurvivalWorldBridge.gd
          test -f tests/world_bridge_restore_reentrancy_test.gd
          grep -Fq 'var _inventory_restore_in_progress: bool = false' systems/SurvivalWorldBridge.gd
          grep -Fq 'func _perform_inventory_restore' systems/SurvivalWorldBridge.gd
      - name: Import and parse KROLL Moonbase Courier
        run: godot --headless --path daily_games/KROLL_Moonbase_Courier --editor --quit
      - name: Run KROLL Moonbase Courier rules tests
        shell: bash
        run: |
          set -o pipefail
          output="$(timeout -k 5s 60s godot --headless --path daily_games/KROLL_Moonbase_Courier --script res://tests/rules_test.gd 2>&1)" || { echo "$output"; exit 1; }
          echo "$output"
          if echo "$output" | grep -E 'SCRIPT ERROR|ERROR:|FAIL:'; then exit 1; fi
          echo "$output" | grep -q "KROLL Moonbase Courier rules tests passed."
      - name: Run KROLL Moonbase Courier runtime smoke test
        shell: bash
        run: |
          set -o pipefail
          output="$(timeout -k 5s 60s godot --headless --path daily_games/KROLL_Moonbase_Courier --script res://tests/game_smoke_test.gd 2>&1)" || { echo "$output"; exit 1; }
          echo "$output"
          if echo "$output" | grep -E 'SCRIPT ERROR|ERROR:|FAIL:'; then exit 1; fi
          echo "$output" | grep -q "KROLL Moonbase Courier runtime smoke test passed."
      - name: Import and parse root project
        run: godot --headless --path . --editor --quit
      - name: Run world bridge restore reentrancy regression
        shell: bash
        run: |
          set -o pipefail
          output="$(timeout -k 5s 90s godot --headless --path . --script res://tests/world_bridge_restore_reentrancy_test.gd 2>&1)" || { echo "$output"; exit 1; }
          echo "$output"
          if echo "$output" | grep -E 'SCRIPT ERROR|ERROR:|FAIL:'; then exit 1; fi
          echo "$output" | grep -q "World bridge restore reentrancy tests passed."
      - name: Checkout cleanup
        if: always()
        shell: bash
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git clean -fd
          git status --short
          test -z "$(git status --porcelain)"
      - name: Post Checkout repository
        if: always()
        run: git status --short
      - name: Stop containers
        if: always()
        run: true
      - name: Complete job
        if: always()
        run: echo "Run 118 focused validation job complete."
