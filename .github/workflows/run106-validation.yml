name: Run 106 focused validation

on:
  pull_request:
    paths:
      - "daily_games/KROLL_Prism_Beam_Lab/**"
      - "systems/MineralGridStreamingDirector.gd"
      - "tests/mineral_grid_streaming_staged_root_lifecycle_test.gd"
      - "tests/README_run106_staged_root_lifecycle.md"
      - ".github/workflows/godot-validation.yml"
      - ".github/workflows/run106-validation.yml"
  push:
    branches: [main]
    paths:
      - "daily_games/KROLL_Prism_Beam_Lab/**"
      - "systems/MineralGridStreamingDirector.gd"
      - "tests/mineral_grid_streaming_staged_root_lifecycle_test.gd"
      - "tests/README_run106_staged_root_lifecycle.md"
      - ".github/workflows/godot-validation.yml"
      - ".github/workflows/run106-validation.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Import and parse KROLL Prism Beam Lab
        run: godot --headless --path daily_games/KROLL_Prism_Beam_Lab --editor --quit
      - name: Run KROLL Prism Beam Lab rules tests
        shell: bash
        run: |
          set -o pipefail
          output="$(timeout -k 5s 45s godot --headless --path daily_games/KROLL_Prism_Beam_Lab --script res://tests/rules_test.gd 2>&1)" || { echo "$output"; exit 1; }
          echo "$output"
          if echo "$output" | grep -E 'SCRIPT ERROR|ERROR:|FAIL:'; then exit 1; fi
          echo "$output" | grep -q "KROLL Prism Beam Lab rules tests passed."
      - name: Run KROLL Prism Beam Lab runtime smoke test
        shell: bash
        run: |
          set -o pipefail
          output="$(timeout -k 5s 50s godot --headless --path daily_games/KROLL_Prism_Beam_Lab --script res://tests/game_smoke_test.gd 2>&1)" || { echo "$output"; exit 1; }
          echo "$output"
          if echo "$output" | grep -E 'SCRIPT ERROR|ERROR:|FAIL:'; then exit 1; fi
          echo "$output" | grep -q "KROLL Prism Beam Lab runtime smoke test passed."
      - name: Import and parse repository project
        run: godot --headless --path . --editor --quit
      - name: Run staged-root lifecycle regression
        shell: bash
        run: |
          set -o pipefail
          output="$(timeout -k 5s 90s godot --headless --path . --script res://tests/mineral_grid_streaming_staged_root_lifecycle_test.gd 2>&1)" || { echo "$output"; exit 1; }
          echo "$output"
          if echo "$output" | grep -E 'SCRIPT ERROR|ERROR:|FAIL:'; then exit 1; fi
          echo "$output" | grep -q "Mineral grid staged-root lifecycle regression passed."
      - name: Checkout cleanup
        if: always()
        shell: bash
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git status --short
