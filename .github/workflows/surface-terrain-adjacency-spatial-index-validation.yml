name: Surface Terrain Adjacency Spatial Index Validation

on:
  pull_request:
    paths:
      - "systems/SurfaceTerrainAdjacencyBinder.gd"
      - "systems/SurfaceTerrainAdjacencyIndex.gd"
      - "systems/SurfaceTerrainOverlayMap.gd"
      - "systems/SurfaceTerrainAffectedComponentPlanner.gd"
      - "systems/SurfaceTerrainTransitionDescriptor.gd"
      - "systems/SurfaceTerrainPatch.gd"
      - "systems/SurfaceTerrainTransitionColliderManager.gd"
      - "systems/SurfaceTerrainCornerConflictResolver.gd"
      - "tests/surface_terrain_adjacency_binder_test.gd"
      - "tests/surface_terrain_adjacency_index_test.gd"
      - "tests/surface_terrain_adjacency_delta_benchmark.gd"
      - "tests/surface_terrain_transition_collider_manager_test.gd"
      - ".github/workflows/surface-terrain-adjacency-spatial-index-validation.yml"
  push:
    branches:
      - main
    paths:
      - "systems/SurfaceTerrainAdjacencyBinder.gd"
      - "systems/SurfaceTerrainAdjacencyIndex.gd"
      - "systems/SurfaceTerrainOverlayMap.gd"
      - "systems/SurfaceTerrainAffectedComponentPlanner.gd"
      - "systems/SurfaceTerrainTransitionDescriptor.gd"
      - "systems/SurfaceTerrainPatch.gd"
      - "systems/SurfaceTerrainTransitionColliderManager.gd"
      - "systems/SurfaceTerrainCornerConflictResolver.gd"
      - "tests/surface_terrain_adjacency_binder_test.gd"
      - "tests/surface_terrain_adjacency_index_test.gd"
      - "tests/surface_terrain_adjacency_delta_benchmark.gd"
      - "tests/surface_terrain_transition_collider_manager_test.gd"
      - ".github/workflows/surface-terrain-adjacency-spatial-index-validation.yml"

concurrency:
  group: surface-terrain-adjacency-spatial-index-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  adjacency-validation:
    name: Godot 4.3 spatial-index regressions
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: barichello/godot-ci:4.3
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Verify inputs
        shell: bash
        run: |
          set -euo pipefail
          godot --version
          test -f project.godot
          test -f systems/SurfaceTerrainAdjacencyBinder.gd
          test -f systems/SurfaceTerrainTransitionDescriptor.gd
          test -f tests/surface_terrain_adjacency_binder_test.gd
          test -f systems/SurfaceTerrainAdjacencyIndex.gd
          test -f systems/SurfaceTerrainAffectedComponentPlanner.gd
          test -f tests/surface_terrain_adjacency_index_test.gd
          test -f tests/surface_terrain_adjacency_delta_benchmark.gd
          grep -Fq '_position_bucket' systems/SurfaceTerrainAdjacencyBinder.gd
          grep -Fq 'adjacency_candidate_checks' systems/SurfaceTerrainAdjacencyBinder.gd
          grep -Fq 'TerrainAdjacencyBinderScript.bind_patches' systems/MineralChunkController.gd
      - name: Import and parse root project
        run: godot --headless --path . --editor --quit
      - name: Run real-patch and spatial-index adjacency regressions
        run: timeout -k 5s 180s godot --headless --path . --script res://tests/surface_terrain_adjacency_binder_test.gd
      - name: Run full-rebuild parity and delta-plan lifecycle regression
        shell: bash
        run: |
          set -o pipefail
          output="$(timeout -k 5s 180s godot --headless --path . --script res://tests/surface_terrain_adjacency_index_test.gd 2>&1)" || { echo "$output"; exit 1; }
          echo "$output"
          if echo "$output" | grep -E 'SCRIPT ERROR|ERROR:|FAIL:'; then exit 1; fi
          echo "$output" | grep -q "Surface terrain adjacency index tests passed."
      - name: Run matched delta-vs-full-rebuild benchmark
        shell: bash
        run: |
          set -euo pipefail
          set -o pipefail
          timeout -k 5s 240s godot --headless --path . --script res://tests/surface_terrain_adjacency_delta_benchmark.gd 2>&1 | tee surface_terrain_adjacency_delta_benchmark.log
          if grep -E 'SCRIPT ERROR|ERROR:|FAIL:' surface_terrain_adjacency_delta_benchmark.log; then
            echo "Godot benchmark emitted an engine or test diagnostic." >&2
            exit 1
          fi
          grep -q "Surface terrain adjacency delta benchmark completed." surface_terrain_adjacency_delta_benchmark.log
          test "$(grep -c '^SURFACE_TERRAIN_ADJACENCY_DELTA_BENCHMARK_JSON:' surface_terrain_adjacency_delta_benchmark.log)" -eq 6
          grep '^SURFACE_TERRAIN_ADJACENCY_DELTA_BENCHMARK_JSON:' surface_terrain_adjacency_delta_benchmark.log | sed 's/^SURFACE_TERRAIN_ADJACENCY_DELTA_BENCHMARK_JSON://' > surface_terrain_adjacency_delta_benchmark.jsonl
          test "$(grep -c '^SURFACE_TERRAIN_OVERLAY_NESTED_COW_BENCHMARK_JSON:' surface_terrain_adjacency_delta_benchmark.log)" -eq 4
          grep '^SURFACE_TERRAIN_OVERLAY_NESTED_COW_BENCHMARK_JSON:' surface_terrain_adjacency_delta_benchmark.log | sed 's/^SURFACE_TERRAIN_OVERLAY_NESTED_COW_BENCHMARK_JSON://' > surface_terrain_overlay_nested_cow_benchmark.jsonl
      - name: Upload matched adjacency benchmark
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surface-terrain-adjacency-delta-benchmark
          path: |
            surface_terrain_adjacency_delta_benchmark.log
            surface_terrain_adjacency_delta_benchmark.jsonl
            surface_terrain_overlay_nested_cow_benchmark.jsonl
          if-no-files-found: warn
          retention-days: 30
      - name: Run transition collider compatibility regression
        run: timeout -k 5s 180s godot --headless --path . --script res://tests/surface_terrain_transition_collider_manager_test.gd
      - name: Verify clean workspace
        if: always()
        shell: bash
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git clean -fd
          test -z "$(git status --porcelain)"
