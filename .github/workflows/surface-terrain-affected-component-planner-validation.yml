name: Surface Terrain Affected Component Planner Validation

on:
  pull_request:
    paths:
      - 'systems/SurfaceTerrainAffectedComponentPlanner.gd'
      - 'systems/SurfaceTerrainTransitionColliderManager.gd'
      - 'tests/surface_terrain_affected_component_planner_test.gd'
      - '.github/workflows/surface-terrain-affected-component-planner-validation.yml'
  workflow_dispatch:

concurrency:
  group: surface-terrain-affected-component-planner-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  affected-component-planner:
    name: Godot 4.3 affected edge-junction closure regression
    runs-on: ubuntu-latest
    timeout-minutes: 5
    container:
      image: barichello/godot-ci:4.3
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Verify exact test inputs
        shell: bash
        run: |
          set -euo pipefail
          godot --version
          test -f project.godot
          test -f systems/SurfaceTerrainAffectedComponentPlanner.gd
          test -f systems/SurfaceTerrainTransitionColliderManager.gd
          test -f tests/surface_terrain_affected_component_planner_test.gd
      - name: Import and parse root project
        run: godot --headless --path . --editor --quit
      - name: Run affected edge-junction closure regression
        shell: bash
        run: |
          set -o pipefail
          output="$(timeout -k 5s 60s godot --headless --path . --script res://tests/surface_terrain_affected_component_planner_test.gd 2>&1)" || { echo "$output"; exit 1; }
          echo "$output"
          if echo "$output" | grep -E 'SCRIPT ERROR|ERROR:|FAIL:'; then exit 1; fi
          echo "$output" | grep -q "Surface terrain affected-component planner tests passed."
      - name: Verify clean workspace
        if: always()
        shell: bash
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git clean -fd
          test -z "$(git status --porcelain)"
