name: Run 116 focused validation

on:
  pull_request:
    paths:
      - "daily_games/KROLL_Drift_Rescue/**"
      - "systems/SurvivalWorldBridge.gd"
      - "tests/world_bridge_operation_result_test.gd"
      - "tests/README_run113_bridge_operation_validation.md"
      - "docs/README_run116_inventory_operation_atomicity.md"
      - ".github/workflows/run116-validation.yml"
      - ".github/workflows/godot-validation.yml"
  push:
    branches: [main]
    paths:
      - "daily_games/KROLL_Drift_Rescue/**"
      - "systems/SurvivalWorldBridge.gd"
      - "tests/world_bridge_operation_result_test.gd"
      - "tests/README_run113_bridge_operation_validation.md"
      - "docs/README_run116_inventory_operation_atomicity.md"
      - ".github/workflows/run116-validation.yml"
      - ".github/workflows/godot-validation.yml"

jobs:
  validate:
    name: Run 116 Focused Gate
    runs-on: ubuntu-latest
    timeout-minutes: 12
    container:
      image: barichello/godot-ci:4.3
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Verify Run 116 inputs
        shell: bash
        run: |
          set -euo pipefail
          godot --version
          test -f daily_games/KROLL_Drift_Rescue/project.godot
          test -f daily_games/KROLL_Drift_Rescue/main.tscn
          test -f daily_games/KROLL_Drift_Rescue/main.gd
          test -f daily_games/KROLL_Drift_Rescue/rules.gd
          test -f daily_games/KROLL_Drift_Rescue/tests/rules_test.gd
          test -f daily_games/KROLL_Drift_Rescue/tests/game_smoke_test.gd
          test -f systems/SurvivalWorldBridge.gd
          test -f tests/world_bridge_operation_result_test.gd
          grep -Fq 'func _rollback_inventory_operation' systems/SurvivalWorldBridge.gd
      - name: Import and parse KROLL Drift Rescue
        run: godot --headless --path daily_games/KROLL_Drift_Rescue --editor --quit
      - name: Run KROLL Drift Rescue rules tests
        shell: bash
        run: |
          set -o pipefail
          output="$(timeout -k 5s 60s godot --headless --path daily_games/KROLL_Drift_Rescue --script res://tests/rules_test.gd 2>&1)" || { echo "$output"; exit 1; }
          echo "$output"
          if echo "$output" | grep -E 'SCRIPT ERROR|ERROR:|FAIL:'; then exit 1; fi
          echo "$output" | grep -q "KROLL Drift Rescue rules tests passed."
      - name: Run KROLL Drift Rescue runtime smoke test
        shell: bash
        run: |
          set -o pipefail
          output="$(timeout -k 5s 60s godot --headless --path daily_games/KROLL_Drift_Rescue --script res://tests/game_smoke_test.gd 2>&1)" || { echo "$output"; exit 1; }
          echo "$output"
          if echo "$output" | grep -E 'SCRIPT ERROR|ERROR:|FAIL:'; then exit 1; fi
          echo "$output" | grep -q "KROLL Drift Rescue runtime smoke test passed."
      - name: Import and parse root project
        run: godot --headless --path . --editor --quit
      - name: Run world bridge inventory operation atomicity regression
        shell: bash
        run: |
          set -o pipefail
          output="$(timeout -k 5s 90s godot --headless --path . --script res://tests/world_bridge_operation_result_test.gd 2>&1)" || { echo "$output"; exit 1; }
          echo "$output"
          if echo "$output" | grep -E 'SCRIPT ERROR|ERROR:|FAIL:'; then exit 1; fi
          echo "$output" | grep -q "World bridge inventory operation atomicity tests passed."
      - name: Checkout cleanup
        if: always()
        shell: bash
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git clean -fd
          git status --short
          test -z "$(git status --porcelain)"
      - name: Post Checkout repository
        if: always()
        run: git status --short
      - name: Stop containers
        if: always()
        run: true
      - name: Complete job
        if: always()
        run: echo "Run 116 focused validation job complete."
