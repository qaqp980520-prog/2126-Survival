name: Mineral Grid Streaming Lifecycle Validation

on:
  pull_request:
    paths:
      - "systems/MineralGridStreamingDirector.gd"
      - "tests/helpers/FakeMineralChunkController.gd"
      - "tests/mineral_grid_streaming_sync_registration_lifecycle_test.gd"
      - "tests/mineral_grid_streaming_async_registration_contract_test.gd"
      - "tests/mineral_grid_streaming_position_validation_test.gd"
      - "tests/mineral_grid_streaming_async_test.gd"
      - "docs/MINERAL_GRID_ASYNC_REGISTRATION_RESULT_CONTRACT_M0_3.md"
      - "docs/MINERAL_GRID_STREAMING_RUNTIME_RADIUS_CAP_M0_3_4.md"
      - "docs/MINERAL_GRID_STREAMING_SYNC_REGISTRATION_LIFECYCLE_GUARD_M0_1.md"
      - ".github/workflows/mineral-grid-streaming-lifecycle-validation.yml"
      - ".github/workflows/godot-validation.yml"
  push:
    branches: [main]
    paths:
      - "systems/MineralGridStreamingDirector.gd"
      - "tests/helpers/FakeMineralChunkController.gd"
      - "tests/mineral_grid_streaming_sync_registration_lifecycle_test.gd"
      - "tests/mineral_grid_streaming_async_registration_contract_test.gd"
      - "tests/mineral_grid_streaming_position_validation_test.gd"
      - "tests/mineral_grid_streaming_async_test.gd"
      - "docs/MINERAL_GRID_ASYNC_REGISTRATION_RESULT_CONTRACT_M0_3.md"
      - "docs/MINERAL_GRID_STREAMING_RUNTIME_RADIUS_CAP_M0_3_4.md"
      - "docs/MINERAL_GRID_STREAMING_SYNC_REGISTRATION_LIFECYCLE_GUARD_M0_1.md"
      - ".github/workflows/mineral-grid-streaming-lifecycle-validation.yml"
      - ".github/workflows/godot-validation.yml"

jobs:
  validate:
    name: Mineral Grid Streaming Lifecycle Gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: barichello/godot-ci:4.3
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Verify Godot version and lifecycle inputs
        shell: bash
        run: |
          set -euo pipefail
          godot --version
          test -f project.godot
          test -f systems/MineralGridStreamingDirector.gd
          test -f tests/helpers/FakeMineralChunkController.gd
          test -f tests/mineral_grid_streaming_sync_registration_lifecycle_test.gd
          test -f tests/mineral_grid_streaming_async_registration_contract_test.gd
          test -f tests/mineral_grid_streaming_position_validation_test.gd
          test -f tests/mineral_grid_streaming_async_test.gd
          grep -Fq 'MIN_CHUNK_SIZE: float = 1.0' systems/MineralGridStreamingDirector.gd
          grep -Fq 'MAX_CHUNK_SIZE: float = 4096.0' systems/MineralGridStreamingDirector.gd
          grep -Fq 'MAX_LOAD_RADIUS' systems/MineralGridStreamingDirector.gd
          grep -Fq 'func _is_valid_grid_configuration' systems/MineralGridStreamingDirector.gd
          grep -Fq 'chunk_size_x >= MIN_CHUNK_SIZE' systems/MineralGridStreamingDirector.gd
          grep -Fq 'chunk_size_z >= MIN_CHUNK_SIZE' systems/MineralGridStreamingDirector.gd
          grep -Fq 'chunk_size_x <= MAX_CHUNK_SIZE' systems/MineralGridStreamingDirector.gd
          grep -Fq 'chunk_size_z <= MAX_CHUNK_SIZE' systems/MineralGridStreamingDirector.gd
          grep -Fq 'load_radius >= 0' systems/MineralGridStreamingDirector.gd
          grep -Fq 'load_radius <= MAX_LOAD_RADIUS' systems/MineralGridStreamingDirector.gd
          grep -Fq 'controller_ready_after_load' systems/MineralGridStreamingDirector.gd
          grep -Fq 'candidate_loaded' systems/MineralGridStreamingDirector.gd
          grep -Fq 'or not candidate_loaded' systems/MineralGridStreamingDirector.gd
      - name: Import and parse root project
        run: godot --headless --path . --editor --quit
      - name: Run synchronous mineral chunk registration lifecycle regression
        shell: bash
        run: |
          set -o pipefail
          output="$(timeout -k 5s 90s godot --headless --path . --script res://tests/mineral_grid_streaming_sync_registration_lifecycle_test.gd 2>&1)" || { echo "$output"; exit 1; }
          echo "$output"
          if echo "$output" | grep -E 'SCRIPT ERROR|ERROR:|FAIL:'; then exit 1; fi
          echo "$output" | grep -q "Mineral grid synchronous registration lifecycle tests passed."
      - name: Run async mineral chunk registration result contract regression
        shell: bash
        run: |
          set -o pipefail
          output="$(timeout -k 5s 90s godot --headless --path . --script res://tests/mineral_grid_streaming_async_registration_contract_test.gd 2>&1)" || { echo "$output"; exit 1; }
          echo "$output"
          if echo "$output" | grep -E 'SCRIPT ERROR|ERROR:|FAIL:'; then exit 1; fi
          echo "$output" | grep -q "Mineral grid async registration result contract tests passed."

      - name: Run mineral grid runtime radius position validation regression
        shell: bash
        run: |
          set -o pipefail
          output="$(timeout -k 5s 90s godot --headless --path . --script res://tests/mineral_grid_streaming_position_validation_test.gd 2>&1)" || { echo "$output"; exit 1; }
          echo "$output"
          if echo "$output" | grep -E 'SCRIPT ERROR|ERROR:|FAIL:'; then exit 1; fi
          echo "$output" | grep -q "Mineral grid streaming position validation tests passed."
      - name: Run bounded async mineral streaming regression
        shell: bash
        run: |
          set -o pipefail
          output="$(timeout -k 5s 180s godot --headless --path . --script res://tests/mineral_grid_streaming_async_test.gd 2>&1)" || { echo "$output"; exit 1; }
          echo "$output"
          if echo "$output" | grep -E 'SCRIPT ERROR|ERROR:|FAIL:'; then exit 1; fi
          echo "$output" | grep -q "Mineral grid bounded async streaming tests passed."
      - name: Checkout cleanup
        if: always()
        shell: bash
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git clean -fd
          git status --short
          test -z "$(git status --porcelain)"
      - name: Complete job
        if: always()
        run: echo "Mineral grid lifecycle validation complete."
