name: Surface Terrain Partial Collider Transaction

on:
  pull_request:
    paths:
      - 'systems/SurfaceTerrainTransitionColliderManager.gd'
      - 'systems/SurfaceTerrainAffectedComponentPlanner.gd'
      - 'systems/SurfaceTerrainColliderPreservePlanner.gd'
      - 'systems/SurfaceTerrainPatch.gd'
      - 'tests/surface_terrain_collider_partial_transaction_test.gd'
      - '.github/workflows/surface-terrain-collider-partial-transaction-validation.yml'
      - 'docs/SURFACE_TERRAIN_PARTIAL_COLLIDER_TRANSACTION_M0_2_7.md'
  workflow_dispatch:

concurrency:
  group: surface-terrain-partial-collider-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  partial-collider-transaction:
    name: Godot 4.3 partial collider transaction regression
    runs-on: ubuntu-latest
    timeout-minutes: 8
    container:
      image: barichello/godot-ci:4.3
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Verify exact test inputs
        shell: bash
        run: |
          set -euo pipefail
          godot --version
          test -f project.godot
          test -f systems/SurfaceTerrainTransitionColliderManager.gd
          test -f systems/SurfaceTerrainAffectedComponentPlanner.gd
          test -f systems/SurfaceTerrainColliderPreservePlanner.gd
          test -f tests/surface_terrain_collider_partial_transaction_test.gd
      - name: Import and parse root project
        run: godot --headless --path . --editor --quit
      - name: Run partial collider transaction regressions
        shell: bash
        run: |
          set -o pipefail
          output="$(timeout -k 5s 120s godot --headless --path . --script res://tests/surface_terrain_collider_partial_transaction_test.gd 2>&1)" || { echo "$output"; exit 1; }
          echo "$output"
          if echo "$output" | grep -E 'SCRIPT ERROR|ERROR:|FAIL:'; then exit 1; fi
          echo "$output" | grep -q "Surface terrain partial collider transaction tests passed."
      - name: Verify clean workspace
        if: always()
        shell: bash
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git clean -fd
          test -z "$(git status --porcelain)"
