name: Run 107 focused validation

on:
  pull_request:
    paths:
      - "daily_games/KROLL_Waveform_Calibrator/**"
      - "systems/MineralGridStreamingDirector.gd"
      - "tests/mineral_grid_streaming_sync_controller_lifecycle_test.gd"
      - "tests/README_run107_sync_controller_lifecycle.md"
      - ".github/workflows/godot-validation.yml"
      - ".github/workflows/run105-validation.yml"
      - ".github/workflows/run107-validation.yml"
  push:
    branches: [main]
    paths:
      - "daily_games/KROLL_Waveform_Calibrator/**"
      - "systems/MineralGridStreamingDirector.gd"
      - "tests/mineral_grid_streaming_sync_controller_lifecycle_test.gd"
      - "tests/README_run107_sync_controller_lifecycle.md"
      - ".github/workflows/godot-validation.yml"
      - ".github/workflows/run107-validation.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Import and parse KROLL Waveform Calibrator
        run: godot --headless --path daily_games/KROLL_Waveform_Calibrator --editor --quit
      - name: Run KROLL Waveform Calibrator rules tests
        shell: bash
        run: |
          set -o pipefail
          output="$(timeout -k 5s 45s godot --headless --path daily_games/KROLL_Waveform_Calibrator --script res://tests/rules_test.gd 2>&1)" || { echo "$output"; exit 1; }
          echo "$output"
          if echo "$output" | grep -E 'SCRIPT ERROR|ERROR:|FAIL:'; then exit 1; fi
          echo "$output" | grep -q "KROLL Waveform Calibrator rules tests passed."
      - name: Run KROLL Waveform Calibrator runtime smoke test
        shell: bash
        run: |
          set -o pipefail
          output="$(timeout -k 5s 50s godot --headless --path daily_games/KROLL_Waveform_Calibrator --script res://tests/game_smoke_test.gd 2>&1)" || { echo "$output"; exit 1; }
          echo "$output"
          if echo "$output" | grep -E 'SCRIPT ERROR|ERROR:|FAIL:'; then exit 1; fi
          echo "$output" | grep -q "KROLL Waveform Calibrator runtime smoke test passed."
      - name: Import and parse repository project
        run: godot --headless --path . --editor --quit
      - name: Run synchronous controller lifecycle regression
        shell: bash
        run: |
          set -o pipefail
          output="$(timeout -k 5s 90s godot --headless --path . --script res://tests/mineral_grid_streaming_sync_controller_lifecycle_test.gd 2>&1)" || { echo "$output"; exit 1; }
          echo "$output"
          if echo "$output" | grep -E 'SCRIPT ERROR|ERROR:|FAIL:'; then exit 1; fi
          echo "$output" | grep -q "Mineral grid synchronous controller lifecycle regression passed."
      - name: Checkout cleanup
        if: always()
        shell: bash
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git status --short
