name: Run 108 focused validation

on:
  pull_request:
    paths:
      - "daily_games/KROLL_Pulse_Reactor/**"
      - "systems/MineralGridStreamingDirector.gd"
      - "tests/helpers/FakeMineralChunkController.gd"
      - "tests/mineral_grid_streaming_rollback_lifecycle_test.gd"
      - "tests/README_run108_rollback_lifecycle.md"
      - ".github/workflows/run108-validation.yml"
      - ".github/workflows/godot-validation.yml"
  push:
    branches: [main]
    paths:
      - "daily_games/KROLL_Pulse_Reactor/**"
      - "systems/MineralGridStreamingDirector.gd"
      - "tests/helpers/FakeMineralChunkController.gd"
      - "tests/mineral_grid_streaming_rollback_lifecycle_test.gd"
      - "tests/README_run108_rollback_lifecycle.md"
      - ".github/workflows/run108-validation.yml"
      - ".github/workflows/godot-validation.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Print engine version and verify inputs
        shell: bash
        run: |
          set -euo pipefail
          godot --version
          test -f daily_games/KROLL_Pulse_Reactor/project.godot
          test -f daily_games/KROLL_Pulse_Reactor/main.tscn
          test -f daily_games/KROLL_Pulse_Reactor/main.gd
          test -f daily_games/KROLL_Pulse_Reactor/rules.gd
          test -f daily_games/KROLL_Pulse_Reactor/tests/rules_test.gd
          test -f daily_games/KROLL_Pulse_Reactor/tests/game_smoke_test.gd
          test -f tests/mineral_grid_streaming_rollback_lifecycle_test.gd
          grep -Fq 'func _restore_unloaded_chunks' systems/MineralGridStreamingDirector.gd
          grep -Fq 'func _rollback_new_loads' systems/MineralGridStreamingDirector.gd
      - name: Import and parse KROLL Pulse Reactor
        run: godot --headless --path daily_games/KROLL_Pulse_Reactor --editor --quit
      - name: Run KROLL Pulse Reactor rules tests
        shell: bash
        run: |
          set -o pipefail
          output="$(timeout -k 5s 45s godot --headless --path daily_games/KROLL_Pulse_Reactor --script res://tests/rules_test.gd 2>&1)" || { echo "$output"; exit 1; }
          echo "$output"
          if echo "$output" | grep -E 'SCRIPT ERROR|ERROR:|FAIL:'; then exit 1; fi
          echo "$output" | grep -q "KROLL Pulse Reactor rules tests passed."
      - name: Run KROLL Pulse Reactor runtime smoke test
        shell: bash
        run: |
          set -o pipefail
          output="$(timeout -k 5s 50s godot --headless --path daily_games/KROLL_Pulse_Reactor --script res://tests/game_smoke_test.gd 2>&1)" || { echo "$output"; exit 1; }
          echo "$output"
          if echo "$output" | grep -E 'SCRIPT ERROR|ERROR:|FAIL:'; then exit 1; fi
          echo "$output" | grep -q "KROLL Pulse Reactor runtime smoke test passed."
      - name: Import and parse repository project
        run: godot --headless --path . --editor --quit
      - name: Run rollback Controller lifecycle regression
        shell: bash
        run: |
          set -o pipefail
          output="$(timeout -k 5s 90s godot --headless --path . --script res://tests/mineral_grid_streaming_rollback_lifecycle_test.gd 2>&1)" || { echo "$output"; exit 1; }
          echo "$output"
          if echo "$output" | grep -E 'SCRIPT ERROR|ERROR:|FAIL:'; then exit 1; fi
          echo "$output" | grep -q "Mineral grid rollback lifecycle regression passed."
      - name: Checkout cleanup
        if: always()
        shell: bash
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git status --short
