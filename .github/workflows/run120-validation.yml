name: Run 120 focused validation

on:
  pull_request:
    paths:
      - "daily_games/KROLL_Fossil_Extraction_Lab/**"
      - "systems/MineralGridStreamingDirector.gd"
      - "tests/helpers/FakeMineralChunkController.gd"
      - "tests/mineral_grid_streaming_sync_registration_lifecycle_test.gd"
      - "docs/README_run120_fossil_extraction.md"
      - "docs/README_run120_streaming_controller_commit_guard.md"
      - ".github/workflows/run120-validation.yml"
      - ".github/workflows/godot-validation.yml"
  push:
    branches: [main]
    paths:
      - "daily_games/KROLL_Fossil_Extraction_Lab/**"
      - "systems/MineralGridStreamingDirector.gd"
      - "tests/helpers/FakeMineralChunkController.gd"
      - "tests/mineral_grid_streaming_sync_registration_lifecycle_test.gd"
      - "prototypes/SurvivalTestHub.gd"
      - "tests/survival_test_hub_smoke_test.gd"
      - "docs/README_run120_fossil_extraction.md"
      - "docs/README_run120_streaming_controller_commit_guard.md"
      - ".github/workflows/run120-validation.yml"
      - ".github/workflows/godot-validation.yml"

jobs:
  validate:
    name: Run 120 Focused Gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: barichello/godot-ci:4.3
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Verify Run 120 inputs
        shell: bash
        run: |
          set -euo pipefail
          godot --version
          test -f daily_games/KROLL_Fossil_Extraction_Lab/project.godot
          test -f daily_games/KROLL_Fossil_Extraction_Lab/main.tscn
          test -f daily_games/KROLL_Fossil_Extraction_Lab/main.gd
          test -f daily_games/KROLL_Fossil_Extraction_Lab/rules.gd
          test -f daily_games/KROLL_Fossil_Extraction_Lab/tests/rules_test.gd
          test -f daily_games/KROLL_Fossil_Extraction_Lab/tests/game_smoke_test.gd
          test -f systems/MineralGridStreamingDirector.gd
          test -f tests/helpers/FakeMineralChunkController.gd
          test -f tests/mineral_grid_streaming_sync_registration_lifecycle_test.gd
          test -f docs/README_run120_fossil_extraction.md
          test -f docs/README_run120_streaming_controller_commit_guard.md
          grep -Fq 'controller_ready_after_load' systems/MineralGridStreamingDirector.gd
          grep -Fq 'candidate_loaded' systems/MineralGridStreamingDirector.gd
      - name: Import and parse KROLL Fossil Extraction Lab
        run: godot --headless --path daily_games/KROLL_Fossil_Extraction_Lab --editor --quit
      - name: Run KROLL Fossil Extraction Lab rules tests
        shell: bash
        run: |
          set -o pipefail
          output="$(timeout -k 5s 60s godot --headless --path daily_games/KROLL_Fossil_Extraction_Lab --script res://tests/rules_test.gd 2>&1)" || { echo "$output"; exit 1; }
          echo "$output"
          if echo "$output" | grep -E 'SCRIPT ERROR|ERROR:|FAIL:'; then exit 1; fi
          echo "$output" | grep -q "KROLL Fossil Extraction Lab rules tests passed."
      - name: Run KROLL Fossil Extraction Lab runtime smoke test
        shell: bash
        run: |
          set -o pipefail
          output="$(timeout -k 5s 60s godot --headless --path daily_games/KROLL_Fossil_Extraction_Lab --script res://tests/game_smoke_test.gd 2>&1)" || { echo "$output"; exit 1; }
          echo "$output"
          if echo "$output" | grep -E 'SCRIPT ERROR|ERROR:|FAIL:'; then exit 1; fi
          echo "$output" | grep -q "KROLL Fossil Extraction Lab runtime smoke test passed."
      - name: Import and parse root 2126 Survival project
        run: godot --headless --path . --editor --quit
      - name: Run synchronous mineral chunk registration lifecycle regression
        shell: bash
        run: |
          set -o pipefail
          output="$(timeout -k 5s 90s godot --headless --path . --script res://tests/mineral_grid_streaming_sync_registration_lifecycle_test.gd 2>&1)" || { echo "$output"; exit 1; }
          echo "$output"
          if echo "$output" | grep -E 'SCRIPT ERROR|ERROR:|FAIL:'; then exit 1; fi
          echo "$output" | grep -q "Mineral grid synchronous registration lifecycle tests passed."
      - name: Checkout cleanup
        if: always()
        shell: bash
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git clean -fd
          git status --short
          test -z "$(git status --porcelain)"
      - name: Post Checkout repository
        if: always()
        run: git status --short
      - name: Stop containers
        if: always()
        run: true
      - name: Complete job
        if: always()
        run: echo "Run 120 focused validation job complete."
