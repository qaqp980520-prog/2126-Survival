name: Run 105–106 focused validation

on:
  pull_request:
    paths:
      - "daily_games/KROLL_Orbital_Curling/**"
      - "prototypes/SurvivalTestHub.gd"
      - "tests/survival_test_hub_smoke_test.gd"
      - "tests/mineral_grid_streaming_queued_root_crop_recovery_test.gd"
      - "systems/CropPlotController.gd"
      - "systems/CropRegistry.gd"
      - "systems/MineralChunkController.gd"
      - ".github/workflows/godot-validation.yml"
      - "daily_games/KROLL_Prism_Beam_Lab/**"
      - "systems/MineralGridStreamingDirector.gd"
      - "tests/mineral_grid_streaming_staged_root_lifecycle_test.gd"
      - "tests/README_run106_staged_root_lifecycle.md"
      - ".github/workflows/run106-validation.yml"
      - ".github/workflows/run105-validation.yml"
  push:
    branches: [main]
    paths:
      - "daily_games/KROLL_Orbital_Curling/**"
      - "prototypes/SurvivalTestHub.gd"
      - "tests/survival_test_hub_smoke_test.gd"
      - "tests/mineral_grid_streaming_queued_root_crop_recovery_test.gd"
      - "systems/CropPlotController.gd"
      - "systems/CropRegistry.gd"
      - "systems/MineralChunkController.gd"
      - ".github/workflows/godot-validation.yml"
      - ".github/workflows/run105-validation.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Import and parse KROLL Orbital Curling
        run: godot --headless --path daily_games/KROLL_Orbital_Curling --editor --quit
      - name: Run KROLL Orbital Curling rules tests
        shell: bash
        run: |
          set -o pipefail
          output="$(timeout -k 5s 45s godot --headless --path daily_games/KROLL_Orbital_Curling --script res://tests/rules_test.gd 2>&1)" || { echo "$output"; exit 1; }
          echo "$output"
          if echo "$output" | grep -E 'SCRIPT ERROR|ERROR:|FAIL:'; then exit 1; fi
          echo "$output" | grep -q "KROLL Orbital Curling rules tests passed."
      - name: Run KROLL Orbital Curling runtime smoke test
        shell: bash
        run: |
          set -o pipefail
          output="$(timeout -k 5s 50s godot --headless --path daily_games/KROLL_Orbital_Curling --script res://tests/game_smoke_test.gd 2>&1)" || { echo "$output"; exit 1; }
          echo "$output"
          if echo "$output" | grep -E 'SCRIPT ERROR|ERROR:|FAIL:'; then exit 1; fi
          echo "$output" | grep -q "KROLL Orbital Curling runtime smoke test passed."
      - name: Import and parse repository project
        run: godot --headless --path . --editor --quit
      - name: Run Survival Test Hub smoke test
        shell: bash
        run: |
          set -o pipefail
          output="$(timeout -k 5s 60s godot --headless --path . --script res://tests/survival_test_hub_smoke_test.gd 2>&1)" || { echo "$output"; exit 1; }
          echo "$output"
          if echo "$output" | grep -E 'SCRIPT ERROR|ERROR:|FAIL:'; then exit 1; fi
          echo "$output" | grep -q "Survival test hub smoke test passed."
      - name: Run queued-root crop recovery integration test
        shell: bash
        run: |
          set -o pipefail
          output="$(timeout -k 5s 90s godot --headless --path . --script res://tests/mineral_grid_streaming_queued_root_crop_recovery_test.gd 2>&1)" || { echo "$output"; exit 1; }
          echo "$output"
          if echo "$output" | grep -E 'SCRIPT ERROR|ERROR:|FAIL:'; then exit 1; fi
          echo "$output" | grep -q "Mineral grid queued-root crop recovery regression passed."
      - name: Run queued-root recovery regression
        shell: bash
        run: |
          set -o pipefail
          output="$(timeout -k 5s 90s godot --headless --path . --script res://tests/mineral_grid_streaming_queued_root_recovery_test.gd 2>&1)" || { echo "$output"; exit 1; }
          echo "$output"
          if echo "$output" | grep -E 'SCRIPT ERROR|ERROR:|FAIL:'; then exit 1; fi
          echo "$output" | grep -q "Mineral grid queued-root recovery regression passed."

      - name: Verify Run 106 Prism Beam Lab and staged-root lifecycle inputs
        shell: bash
        run: |
          set -euo pipefail
          test -f daily_games/KROLL_Prism_Beam_Lab/project.godot
          test -f daily_games/KROLL_Prism_Beam_Lab/main.tscn
          test -f daily_games/KROLL_Prism_Beam_Lab/main.gd
          test -f daily_games/KROLL_Prism_Beam_Lab/rules.gd
          test -f daily_games/KROLL_Prism_Beam_Lab/tests/rules_test.gd
          test -f daily_games/KROLL_Prism_Beam_Lab/tests/game_smoke_test.gd
          test -f tests/mineral_grid_streaming_staged_root_lifecycle_test.gd
          test -f tests/README_run106_staged_root_lifecycle.md
          test -f .github/workflows/run106-validation.yml
          grep -Fq 'func has_unique_solution' daily_games/KROLL_Prism_Beam_Lab/rules.gd
          grep -Fq 'func _validate_async_staged_roots' systems/MineralGridStreamingDirector.gd
          grep -Fq 'staged_root_queued_for_deletion' systems/MineralGridStreamingDirector.gd

      - name: Import and parse KROLL Prism Beam Lab
        run: godot --headless --path daily_games/KROLL_Prism_Beam_Lab --editor --quit

      - name: Run KROLL Prism Beam Lab rules tests
        shell: bash
        run: |
          set -o pipefail
          output="$(timeout -k 5s 45s godot --headless --path daily_games/KROLL_Prism_Beam_Lab --script res://tests/rules_test.gd 2>&1)" || { echo "$output"; exit 1; }
          echo "$output"
          if echo "$output" | grep -E 'SCRIPT ERROR|ERROR:|FAIL:'; then exit 1; fi
          echo "$output" | grep -q "KROLL Prism Beam Lab rules tests passed."

      - name: Run KROLL Prism Beam Lab runtime smoke test
        shell: bash
        run: |
          set -o pipefail
          output="$(timeout -k 5s 50s godot --headless --path daily_games/KROLL_Prism_Beam_Lab --script res://tests/game_smoke_test.gd 2>&1)" || { echo "$output"; exit 1; }
          echo "$output"
          if echo "$output" | grep -E 'SCRIPT ERROR|ERROR:|FAIL:'; then exit 1; fi
          echo "$output" | grep -q "KROLL Prism Beam Lab runtime smoke test passed."

      - name: Run staged-root lifecycle regression
        shell: bash
        run: |
          set -o pipefail
          output="$(timeout -k 5s 90s godot --headless --path . --script res://tests/mineral_grid_streaming_staged_root_lifecycle_test.gd 2>&1)" || { echo "$output"; exit 1; }
          echo "$output"
          if echo "$output" | grep -E 'SCRIPT ERROR|ERROR:|FAIL:'; then exit 1; fi
          echo "$output" | grep -q "Mineral grid staged-root lifecycle regression passed."

      - name: Checkout cleanup
        if: always()
        shell: bash
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git status --short
