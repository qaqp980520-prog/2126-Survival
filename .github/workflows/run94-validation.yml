name: Run 94–100 focused Godot validation

on:
  pull_request:
    paths:
      - 'daily_games/KROLL_Sonar_Triangulator/**'
      - 'daily_games/KROLL_Stratosphere_Balloonist/**'
      - 'daily_games/KROLL_Emberline_Command/**'
      - 'systems/SurfaceTerrainTransitionColliderManager.gd'
      - 'tests/surface_terrain_four_way_corner_cap_test.gd'
      - 'tests/surface_terrain_multi_junction_corner_cap_test.gd'
      - 'tests/surface_terrain_randomized_corner_cap_soak_test.gd'
      - 'tests/README_run96_terrain_soak.md'
      - 'daily_games/KROLL_Mess_Hall_Rush/**'
      - 'daily_games/KROLL_Fragment_Assembly_Lab/**'
      - 'daily_games/KROLL_Tether_Bot_Relay/**'
      - 'daily_games/KROLL_Archive_Curator/**'
      - 'tests/surface_terrain_randomized_corner_cap_extended_soak_test.gd'
      - 'tests/surface_terrain_randomized_corner_cap_run97_60_layout_soak_test.gd'
      - 'tests/surface_terrain_corner_cap_rebind_lifecycle_test.gd'
      - 'tests/README_run99_corner_cap_rebind.md'
      - 'tests/mineral_chunk_controller_terrain_rebind_test.gd'
      - 'tests/README_run100_terrain_controller_rebind.md'
      - 'tests/README_run97_terrain_soak.md'
      - 'tests/surface_terrain_four_way_corner_junction_test.gd'
      - 'prototypes/SurvivalTestHub.gd'
      - 'tests/survival_test_hub_smoke_test.gd'
      - '.github/workflows/run94-validation.yml'
  workflow_dispatch:

jobs:
  validate:
    timeout-minutes: 25
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify Run 94 inputs
        shell: bash
        run: |
          set -euo pipefail
          godot --version
          test -f daily_games/KROLL_Sonar_Triangulator/project.godot
          test -f daily_games/KROLL_Sonar_Triangulator/main.tscn
          test -f daily_games/KROLL_Sonar_Triangulator/main_root.tscn
          test -f daily_games/KROLL_Sonar_Triangulator/main.gd
          test -f daily_games/KROLL_Sonar_Triangulator/rules.gd
          test -f daily_games/KROLL_Sonar_Triangulator/tests/rules_test.gd
          test -f daily_games/KROLL_Sonar_Triangulator/tests/game_smoke_test.gd
          grep -q 'SONAR_TRIANGULATOR_SCENE' prototypes/SurvivalTestHub.gd
          grep -q 'SONAR_TRIANGULATOR_SCENE' tests/survival_test_hub_smoke_test.gd
          grep -q 'labels.has("KROLL Sonar Triangulator")' tests/survival_test_hub_smoke_test.gd
          grep -q 'EMBERLINE_COMMAND_SCENE' prototypes/SurvivalTestHub.gd
          grep -q 'EMBERLINE_COMMAND_SCENE' tests/survival_test_hub_smoke_test.gd
          grep -q 'buttons.size() == 45' tests/survival_test_hub_smoke_test.gd
          test -f daily_games/KROLL_Emberline_Command/project.godot
          test -f daily_games/KROLL_Emberline_Command/tests/rules_test.gd
          test -f tests/surface_terrain_randomized_corner_cap_soak_test.gd
          grep -q 'shared_corner_cap' systems/SurfaceTerrainTransitionColliderManager.gd
          test -f tests/surface_terrain_four_way_corner_cap_test.gd
          test -f tests/surface_terrain_multi_junction_corner_cap_test.gd
          grep -q 'double_trim_count == 4' tests/surface_terrain_multi_junction_corner_cap_test.gd
          grep -q 'four_way_junction' tests/surface_terrain_four_way_corner_junction_test.gd

      - name: Import and parse KROLL Sonar Triangulator
        run: godot --headless --path daily_games/KROLL_Sonar_Triangulator --editor --quit

      - name: Run KROLL Sonar Triangulator rules tests
        shell: bash
        run: |
          set -o pipefail
          output="$(timeout -k 5s 35s godot --headless --path daily_games/KROLL_Sonar_Triangulator --script res://tests/rules_test.gd 2>&1)" || { echo "$output"; exit 1; }
          echo "$output"
          if echo "$output" | grep -E 'SCRIPT ERROR|ERROR:|FAIL:'; then exit 1; fi
          echo "$output" | grep -q "KROLL Sonar Triangulator rules tests passed."

      - name: Run KROLL Sonar Triangulator runtime smoke test
        shell: bash
        run: |
          set -o pipefail
          output="$(timeout -k 5s 40s godot --headless --path daily_games/KROLL_Sonar_Triangulator --script res://tests/game_smoke_test.gd 2>&1)" || { echo "$output"; exit 1; }
          echo "$output"
          if echo "$output" | grep -E 'SCRIPT ERROR|ERROR:|FAIL:'; then exit 1; fi
          echo "$output" | grep -q "KROLL Sonar Triangulator runtime smoke test passed."

      - name: Import and parse root 2126 Survival project
        run: godot --headless --path . --editor --quit

      - name: Run root Test Hub integration smoke test
        shell: bash
        run: |
          set -o pipefail
          output="$(timeout -k 5s 60s godot --headless --path . --script res://tests/survival_test_hub_smoke_test.gd 2>&1)" || { echo "$output"; exit 1; }
          echo "$output"
          if echo "$output" | grep -E 'SCRIPT ERROR|ERROR:|FAIL:'; then exit 1; fi
          echo "$output" | grep -q "Survival test hub smoke test passed."

      - name: Run four-way terrain corner junction regression
        shell: bash
        run: |
          set -o pipefail
          output="$(timeout -k 5s 100s godot --headless --path . --script res://tests/surface_terrain_four_way_corner_junction_test.gd 2>&1)" || { echo "$output"; exit 1; }
          echo "$output"
          if echo "$output" | grep -E 'SCRIPT ERROR|ERROR:|FAIL:'; then exit 1; fi
          echo "$output" | grep -q "Four-way terrain corner junction regression passed."


      - name: Run four-way terrain corner cap geometry regression
        shell: bash
        run: |
          set -o pipefail
          output="$(timeout -k 5s 100s godot --headless --path . --script res://tests/surface_terrain_four_way_corner_cap_test.gd 2>&1)" || { echo "$output"; exit 1; }
          echo "$output"
          if echo "$output" | grep -E 'SCRIPT ERROR|ERROR:|FAIL:'; then exit 1; fi
          echo "$output" | grep -q "Four-way terrain corner cap geometry regression passed."

      - name: Run 3x3 terrain multi-junction corner cap regression
        shell: bash
        run: |
          set -o pipefail
          output="$(timeout -k 5s 120s godot --headless --path . --script res://tests/surface_terrain_multi_junction_corner_cap_test.gd 2>&1)" || { echo "$output"; exit 1; }
          echo "$output"
          if echo "$output" | grep -E 'SCRIPT ERROR|ERROR:|FAIL:'; then exit 1; fi
          echo "$output" | grep -q "Three-by-three terrain multi-junction corner cap regression passed."


      - name: Import and parse KROLL Emberline Command
        run: godot --headless --path daily_games/KROLL_Emberline_Command --editor --quit

      - name: Run KROLL Emberline Command rules tests
        shell: bash
        run: |
          set -o pipefail
          output="$(timeout -k 5s 40s godot --headless --path daily_games/KROLL_Emberline_Command --script res://tests/rules_test.gd 2>&1)" || { echo "$output"; exit 1; }
          echo "$output"
          if echo "$output" | grep -E 'SCRIPT ERROR|ERROR:|FAIL:'; then exit 1; fi
          echo "$output" | grep -q "KROLL Emberline Command rules tests passed."

      - name: Run KROLL Emberline Command runtime smoke test
        shell: bash
        run: |
          set -o pipefail
          output="$(timeout -k 5s 45s godot --headless --path daily_games/KROLL_Emberline_Command --script res://tests/game_smoke_test.gd 2>&1)" || { echo "$output"; exit 1; }
          echo "$output"
          if echo "$output" | grep -E 'SCRIPT ERROR|ERROR:|FAIL:'; then exit 1; fi
          echo "$output" | grep -q "KROLL Emberline Command runtime smoke test passed."

      - name: Run randomized 4x4 terrain corner-cap soak
        shell: bash
        run: |
          set -o pipefail
          output="$(timeout -k 5s 180s godot --headless --path . --script res://tests/surface_terrain_randomized_corner_cap_soak_test.gd 2>&1)" || { echo "$output"; exit 1; }
          echo "$output"
          if echo "$output" | grep -E 'SCRIPT ERROR|ERROR:|FAIL:'; then exit 1; fi
          echo "$output" | grep -q "Run 96 randomized 4x4 terrain corner-cap soak passed"

      - name: Verify Run 97 Mess Hall Rush and extended soak inputs
        shell: bash
        run: |
          set -euo pipefail
          test -f daily_games/KROLL_Mess_Hall_Rush/project.godot
          test -f daily_games/KROLL_Mess_Hall_Rush/main_root.tscn
          test -f daily_games/KROLL_Mess_Hall_Rush/rules.gd
          test -f daily_games/KROLL_Mess_Hall_Rush/tests/rules_test.gd
          test -f daily_games/KROLL_Mess_Hall_Rush/tests/game_smoke_test.gd
          test -f tests/surface_terrain_randomized_corner_cap_extended_soak_test.gd
          grep -q 'required_edge_count' tests/surface_terrain_randomized_corner_cap_extended_soak_test.gd
          grep -q 'equal-height edge' tests/surface_terrain_randomized_corner_cap_extended_soak_test.gd
          grep -q 'MESS_HALL_RUSH_SCENE' prototypes/SurvivalTestHub.gd
          grep -q 'labels.has("KROLL Mess Hall Rush")' tests/survival_test_hub_smoke_test.gd
          grep -q 'buttons.size() == 45' tests/survival_test_hub_smoke_test.gd

      - name: Import and parse KROLL Mess Hall Rush
        run: godot --headless --path daily_games/KROLL_Mess_Hall_Rush --editor --quit

      - name: Run KROLL Mess Hall Rush rules tests
        shell: bash
        run: |
          set -o pipefail
          output="$(timeout -k 5s 45s godot --headless --path daily_games/KROLL_Mess_Hall_Rush --script res://tests/rules_test.gd 2>&1)" || { echo "$output"; exit 1; }
          echo "$output"
          if echo "$output" | grep -E 'SCRIPT ERROR|ERROR:|FAIL:'; then exit 1; fi
          echo "$output" | grep -q "KROLL Mess Hall Rush rules tests passed."

      - name: Run KROLL Mess Hall Rush runtime smoke test
        shell: bash
        run: |
          set -o pipefail
          output="$(timeout -k 5s 45s godot --headless --path daily_games/KROLL_Mess_Hall_Rush --script res://tests/game_smoke_test.gd 2>&1)" || { echo "$output"; exit 1; }
          echo "$output"
          if echo "$output" | grep -E 'SCRIPT ERROR|ERROR:|FAIL:'; then exit 1; fi
          echo "$output" | grep -q "KROLL Mess Hall Rush runtime smoke test passed."

      - name: Run Run 97 historical 60-layout randomized 4x4 terrain soak
        shell: bash
        run: |
          set -o pipefail
          output="$(timeout -k 5s 300s godot --headless --path . --script res://tests/surface_terrain_randomized_corner_cap_run97_60_layout_soak_test.gd 2>&1)" || { echo "$output"; exit 1; }
          echo "$output"
          if echo "$output" | grep -E 'SCRIPT ERROR|ERROR:|FAIL:'; then exit 1; fi
          echo "$output" | grep -q "Run 97 extended 4x4 terrain corner-cap soak passed"

      - name: Verify Run 98 Fragment Assembly Lab inputs
        shell: bash
        run: |
          set -euo pipefail
          test -f daily_games/KROLL_Fragment_Assembly_Lab/project.godot
          test -f daily_games/KROLL_Fragment_Assembly_Lab/main_root.tscn
          test -f daily_games/KROLL_Fragment_Assembly_Lab/rules.gd
          test -f daily_games/KROLL_Fragment_Assembly_Lab/tests/rules_test.gd
          test -f daily_games/KROLL_Fragment_Assembly_Lab/tests/game_smoke_test.gd
          grep -q 'FRAGMENT_ASSEMBLY_LAB_SCENE' prototypes/SurvivalTestHub.gd
          grep -q 'labels.has("KROLL Fragment Assembly Lab")' tests/survival_test_hub_smoke_test.gd
          grep -q 'buttons.size() == 45' tests/survival_test_hub_smoke_test.gd
      - name: Import and parse KROLL Fragment Assembly Lab
        run: godot --headless --path daily_games/KROLL_Fragment_Assembly_Lab --editor --quit
      - name: Run KROLL Fragment Assembly Lab rules tests
        shell: bash
        run: |
          set -o pipefail
          output="$(timeout -k 5s 45s godot --headless --path daily_games/KROLL_Fragment_Assembly_Lab --script res://tests/rules_test.gd 2>&1)" || { echo "$output"; exit 1; }
          echo "$output"
          if echo "$output" | grep -E 'SCRIPT ERROR|ERROR:|FAIL:'; then exit 1; fi
          echo "$output" | grep -q "KROLL Fragment Assembly Lab rules tests passed."
      - name: Run KROLL Fragment Assembly Lab runtime smoke test
        shell: bash
        run: |
          set -o pipefail
          output="$(timeout -k 5s 45s godot --headless --path daily_games/KROLL_Fragment_Assembly_Lab --script res://tests/game_smoke_test.gd 2>&1)" || { echo "$output"; exit 1; }
          echo "$output"
          if echo "$output" | grep -E 'SCRIPT ERROR|ERROR:|FAIL:'; then exit 1; fi
          echo "$output" | grep -q "KROLL Fragment Assembly Lab runtime smoke test passed."

      
      - name: Verify Run 99 Tether Bot Relay and terrain rebind inputs
        shell: bash
        run: |
          set -euo pipefail
          test -f daily_games/KROLL_Tether_Bot_Relay/project.godot
          test -f daily_games/KROLL_Tether_Bot_Relay/main.tscn
          test -f daily_games/KROLL_Tether_Bot_Relay/main_root.tscn
          test -f daily_games/KROLL_Tether_Bot_Relay/main.gd
          test -f daily_games/KROLL_Tether_Bot_Relay/rules.gd
          test -f daily_games/KROLL_Tether_Bot_Relay/tests/rules_test.gd
          test -f daily_games/KROLL_Tether_Bot_Relay/tests/game_smoke_test.gd
          test -f tests/surface_terrain_corner_cap_rebind_lifecycle_test.gd
          grep -q 'TETHER_BOT_RELAY_SCENE' prototypes/SurvivalTestHub.gd
          grep -q 'TETHER_BOT_RELAY_SCENE' tests/survival_test_hub_smoke_test.gd
          grep -q 'buttons.size() == 45' tests/survival_test_hub_smoke_test.gd
          grep -q 'range(24)' tests/surface_terrain_randomized_corner_cap_extended_soak_test.gd
          grep -q 'rng.randi_range(2, 8)' tests/surface_terrain_randomized_corner_cap_extended_soak_test.gd
          grep -q 'Run 99 extended 4x4 terrain corner-cap soak passed' tests/surface_terrain_randomized_corner_cap_extended_soak_test.gd
          grep -q 'resource_path.get_base_dir().path_join("rules.gd")' daily_games/KROLL_Tether_Bot_Relay/main.gd
          grep -q 'typeof(candidate) != TYPE_VECTOR2' daily_games/KROLL_Tether_Bot_Relay/rules.gd
          grep -q 'weakref(old_cap)' tests/surface_terrain_corner_cap_rebind_lifecycle_test.gd

      - name: Import and parse KROLL Tether Bot Relay
        run: godot --headless --path daily_games/KROLL_Tether_Bot_Relay --editor --quit

      - name: Run KROLL Tether Bot Relay rules tests
        shell: bash
        run: |
          set -o pipefail
          output="$(timeout -k 5s 45s godot --headless --path daily_games/KROLL_Tether_Bot_Relay --script res://tests/rules_test.gd 2>&1)" || { echo "$output"; exit 1; }
          echo "$output"
          if echo "$output" | grep -E 'SCRIPT ERROR|ERROR:|FAIL:'; then exit 1; fi
          echo "$output" | grep -q "KROLL Tether Bot Relay rules tests passed."

      - name: Run KROLL Tether Bot Relay runtime smoke test
        shell: bash
        run: |
          set -o pipefail
          output="$(timeout -k 5s 50s godot --headless --path daily_games/KROLL_Tether_Bot_Relay --script res://tests/game_smoke_test.gd 2>&1)" || { echo "$output"; exit 1; }
          echo "$output"
          if echo "$output" | grep -E 'SCRIPT ERROR|ERROR:|FAIL:'; then exit 1; fi
          echo "$output" | grep -q "KROLL Tether Bot Relay runtime smoke test passed."

      - name: Run Run 99 terrain corner-cap patch rebind lifecycle regression
        shell: bash
        run: |
          set -o pipefail
          output="$(timeout -k 5s 150s godot --headless --path . --script res://tests/surface_terrain_corner_cap_rebind_lifecycle_test.gd 2>&1)" || { echo "$output"; exit 1; }
          echo "$output"
          if echo "$output" | grep -E 'SCRIPT ERROR|ERROR:|FAIL:'; then exit 1; fi
          echo "$output" | grep -q "Run 99 terrain corner-cap patch rebind lifecycle regression passed."

      - name: Run Run 99 extended randomized 4x4 terrain corner-cap soak
        shell: bash
        run: |
          set -o pipefail
          output="$(timeout -k 5s 420s godot --headless --path . --script res://tests/surface_terrain_randomized_corner_cap_extended_soak_test.gd 2>&1)" || { echo "$output"; exit 1; }
          echo "$output"
          if echo "$output" | grep -E 'SCRIPT ERROR|ERROR:|FAIL:'; then exit 1; fi
          echo "$output" | grep -q "Run 99 extended 4x4 terrain corner-cap soak passed"

      
      - name: Verify Run 100 Archive Curator and controller-driven terrain rebind inputs
        shell: bash
        run: |
          set -euo pipefail
          test -f daily_games/KROLL_Archive_Curator/project.godot
          test -f daily_games/KROLL_Archive_Curator/main.tscn
          test -f daily_games/KROLL_Archive_Curator/main_root.tscn
          test -f daily_games/KROLL_Archive_Curator/main.gd
          test -f daily_games/KROLL_Archive_Curator/rules.gd
          test -f daily_games/KROLL_Archive_Curator/tests/rules_test.gd
          test -f daily_games/KROLL_Archive_Curator/tests/game_smoke_test.gd
          test -f tests/mineral_chunk_controller_terrain_rebind_test.gd
          test -f tests/README_run100_terrain_controller_rebind.md
          grep -q 'ARCHIVE_CURATOR_SCENE' prototypes/SurvivalTestHub.gd
          grep -q 'ARCHIVE_CURATOR_SCENE' tests/survival_test_hub_smoke_test.gd
          grep -q 'buttons.size() == 45' tests/survival_test_hub_smoke_test.gd
          grep -q 'ADJACENCY_BONUS: int = 2' daily_games/KROLL_Archive_Curator/rules.gd
          grep -q 'MIN_THEME_ITEMS: int = 2' daily_games/KROLL_Archive_Curator/rules.gd
          grep -q 'scroll.name = "ArchiveScroll"' daily_games/KROLL_Archive_Curator/main.gd
          grep -q 'get_viewport_rect().size.x < 1000.0' daily_games/KROLL_Archive_Curator/main.gd
          grep -q 'func _place_selected_in_slot(slot_index: int)' daily_games/KROLL_Archive_Curator/main.gd
          grep -q 'path="res://daily_games/KROLL_Archive_Curator/main.gd"' daily_games/KROLL_Archive_Curator/main_root.tscn
          grep -q 'controller.call("load_chunk"' tests/mineral_chunk_controller_terrain_rebind_test.gd
          grep -q 'controller.call("unload_chunk"' tests/mineral_chunk_controller_terrain_rebind_test.gd
          grep -q 'get_corner_cap_count' tests/mineral_chunk_controller_terrain_rebind_test.gd

      - name: Import and parse KROLL Archive Curator
        run: godot --headless --path daily_games/KROLL_Archive_Curator --editor --quit

      - name: Run KROLL Archive Curator rules tests
        shell: bash
        run: |
          set -o pipefail
          output="$(timeout -k 5s 45s godot --headless --path daily_games/KROLL_Archive_Curator --script res://tests/rules_test.gd 2>&1)" || { echo "$output"; exit 1; }
          echo "$output"
          if echo "$output" | grep -E 'SCRIPT ERROR|ERROR:|FAIL:'; then exit 1; fi
          echo "$output" | grep -q "KROLL Archive Curator rules tests passed."

      - name: Run KROLL Archive Curator runtime smoke test
        shell: bash
        run: |
          set -o pipefail
          output="$(timeout -k 5s 50s godot --headless --path daily_games/KROLL_Archive_Curator --script res://tests/game_smoke_test.gd 2>&1)" || { echo "$output"; exit 1; }
          echo "$output"
          if echo "$output" | grep -E 'SCRIPT ERROR|ERROR:|FAIL:'; then exit 1; fi
          echo "$output" | grep -q "KROLL Archive Curator runtime smoke test passed."

      - name: Run controller-driven terrain patch rebind integration test
        shell: bash
        run: |
          set -o pipefail
          output="$(timeout -k 5s 150s godot --headless --path . --script res://tests/mineral_chunk_controller_terrain_rebind_test.gd 2>&1)" || { echo "$output"; exit 1; }
          echo "$output"
          if echo "$output" | grep -E 'SCRIPT ERROR|ERROR:|FAIL:'; then exit 1; fi
          echo "$output" | grep -q "MineralChunkController terrain rebind integration test passed."
