name: Run 113 focused validation

on:
  pull_request:
    paths:
      - "daily_games/KROLL_Orbital_Surveyor/**"
      - "systems/SurvivalWorldBridge.gd"
      - "tests/world_bridge_operation_result_test.gd"
      - "tests/README_run113_bridge_operation_validation.md"
      - ".github/workflows/run113-validation.yml"
      - ".github/workflows/godot-validation.yml"
  push:
    branches: [main]
    paths:
      - "daily_games/KROLL_Orbital_Surveyor/**"
      - "systems/SurvivalWorldBridge.gd"
      - "tests/world_bridge_operation_result_test.gd"
      - "tests/README_run113_bridge_operation_validation.md"
      - ".github/workflows/run113-validation.yml"
      - ".github/workflows/godot-validation.yml"

jobs:
  validate:
    name: Run 113 Focused Gate
    runs-on: ubuntu-latest
    timeout-minutes: 12
    container:
      image: barichello/godot-ci:4.3
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Verify Run 113 inputs
        shell: bash
        run: |
          set -euo pipefail
          godot --version
          test -f daily_games/KROLL_Orbital_Surveyor/project.godot
          test -f daily_games/KROLL_Orbital_Surveyor/main.tscn
          test -f daily_games/KROLL_Orbital_Surveyor/main.gd
          test -f daily_games/KROLL_Orbital_Surveyor/rules.gd
          test -f daily_games/KROLL_Orbital_Surveyor/tests/rules_test.gd
          test -f daily_games/KROLL_Orbital_Surveyor/tests/game_smoke_test.gd
          test -f systems/SurvivalWorldBridge.gd
          test -f tests/world_bridge_operation_result_test.gd
          grep -Fq 'func _apply_inventory_operation' systems/SurvivalWorldBridge.gd
          grep -Fq 'func _validated_operation_count' systems/SurvivalWorldBridge.gd
      - name: Import and parse KROLL Orbital Surveyor
        run: godot --headless --path daily_games/KROLL_Orbital_Surveyor --editor --quit
      - name: Run KROLL Orbital Surveyor rules tests
        shell: bash
        run: |
          set -o pipefail
          output="$(timeout -k 5s 60s godot --headless --path daily_games/KROLL_Orbital_Surveyor --script res://tests/rules_test.gd 2>&1)" || { echo "$output"; exit 1; }
          echo "$output"
          if echo "$output" | grep -E 'SCRIPT ERROR|ERROR:|FAIL:'; then exit 1; fi
          echo "$output" | grep -q "KROLL Orbital Surveyor rules tests passed."
      - name: Run KROLL Orbital Surveyor runtime smoke test
        shell: bash
        run: |
          set -o pipefail
          output="$(timeout -k 5s 60s godot --headless --path daily_games/KROLL_Orbital_Surveyor --script res://tests/game_smoke_test.gd 2>&1)" || { echo "$output"; exit 1; }
          echo "$output"
          if echo "$output" | grep -E 'SCRIPT ERROR|ERROR:|FAIL:'; then exit 1; fi
          echo "$output" | grep -q "KROLL Orbital Surveyor runtime smoke test passed."
      - name: Import and parse root project
        run: godot --headless --path . --editor --quit
      - name: Run world bridge inventory operation result validation
        shell: bash
        run: |
          set -o pipefail
          output="$(timeout -k 5s 90s godot --headless --path . --script res://tests/world_bridge_operation_result_test.gd 2>&1)" || { echo "$output"; exit 1; }
          echo "$output"
          if echo "$output" | grep -E 'SCRIPT ERROR|ERROR:|FAIL:'; then exit 1; fi
          echo "$output" | grep -q "World bridge inventory operation result validation tests passed."
      - name: Checkout cleanup
        if: always()
        shell: bash
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git status --short
      - name: Post Checkout repository
        if: always()
        run: git status --short
      - name: Stop containers
        if: always()
        run: true
      - name: Complete job
        if: always()
        run: echo "Run 113 focused validation job complete."
