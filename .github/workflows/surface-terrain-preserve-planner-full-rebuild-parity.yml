name: Surface Terrain Preserve Planner Full-Rebuild Parity

on:
  pull_request:
    paths:
      - 'systems/SurfaceTerrainAffectedComponentPlanner.gd'
      - 'systems/SurfaceTerrainColliderPreservePlanner.gd'
      - 'systems/SurfaceTerrainTransitionColliderManager.gd'
      - 'systems/SurfaceTerrainPatch.gd'
      - 'systems/SurfaceTerrainAdjacencyBinder.gd'
      - 'tests/surface_terrain_collider_preserve_planner_parity_test.gd'
      - '.github/workflows/surface-terrain-preserve-planner-full-rebuild-parity.yml'
  workflow_dispatch:

concurrency:
  group: surface-terrain-preserve-planner-parity-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  full-rebuild-parity:
    name: Godot 4.3 preserve planner versus production full rebuild
    runs-on: ubuntu-latest
    timeout-minutes: 12
    container:
      image: barichello/godot-ci:4.3
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Verify exact test inputs
        shell: bash
        run: |
          set -euo pipefail
          godot --version
          test -f project.godot
          test -f systems/SurfaceTerrainAffectedComponentPlanner.gd
          test -f systems/SurfaceTerrainColliderPreservePlanner.gd
          test -f systems/SurfaceTerrainTransitionColliderManager.gd
          test -f tests/surface_terrain_collider_preserve_planner_parity_test.gd
      - name: Import and parse root project
        run: godot --headless --path . --editor --quit
      - name: Run preserve planner full-rebuild parity tests
        shell: bash
        run: |
          set -o pipefail
          output="$(timeout -k 5s 180s godot --headless --path . --script res://tests/surface_terrain_collider_preserve_planner_parity_test.gd 2>&1)" || { echo "$output"; exit 1; }
          echo "$output"
          if echo "$output" | grep -E 'SCRIPT ERROR|ERROR:|FAIL:'; then exit 1; fi
          echo "$output" | grep -q "Surface terrain preserve planner full-rebuild parity tests passed."
      - name: Verify clean workspace
        if: always()
        shell: bash
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git clean -fd
          test -z "$(git status --porcelain)"
