name: Run 23 Network Stabilizer and underground mining validation

on:
  pull_request:
    paths:
      - 'daily_games/KROLL_Network_Stabilizer/**'
      - 'tests/underground_mining_playground_test.gd'
      - 'prototypes/UndergroundMiningPlayground.gd'
      - '.github/workflows/run23-bastion-validation.yml'
  workflow_dispatch:

concurrency:
  group: run23-bastion-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    timeout-minutes: 8
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Import Network Stabilizer
        run: godot --headless --path daily_games/KROLL_Network_Stabilizer --editor --quit
      - name: Run Network Stabilizer rules tests
        shell: bash
        run: |
          set -o pipefail
          output="$(godot --headless --path daily_games/KROLL_Network_Stabilizer --script res://tests/rules_test.gd 2>&1)" || { echo "$output"; exit 1; }
          echo "$output"
          if echo "$output" | grep -E 'SCRIPT ERROR|ERROR:|FAIL:'; then exit 1; fi
          echo "$output" | grep -q "KROLL Network Stabilizer rules tests passed."
      - name: Run Network Stabilizer runtime smoke test
        shell: bash
        run: |
          set -o pipefail
          output="$(godot --headless --path daily_games/KROLL_Network_Stabilizer --script res://tests/game_smoke_test.gd 2>&1)" || { echo "$output"; exit 1; }
          echo "$output"
          if echo "$output" | grep -E 'SCRIPT ERROR|ERROR:|FAIL:'; then exit 1; fi
          echo "$output" | grep -q "KROLL Network Stabilizer runtime smoke test passed."
      - name: Run underground inventory overflow regression
        shell: bash
        run: |
          set -o pipefail
          output="$(timeout 35s godot --headless --path . --script res://tests/underground_mining_playground_test.gd 2>&1)" || { echo "$output"; exit 1; }
          echo "$output"
          if echo "$output" | grep -E 'SCRIPT ERROR|ERROR:|FAIL:'; then exit 1; fi
          echo "$output" | grep -q "Underground mining playground integration tests passed."
